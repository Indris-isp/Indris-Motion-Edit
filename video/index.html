<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ISP Agency Promo</title>
<style>
@font-face{font-family:Inter;src:url(fonts/Inter-400.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(fonts/Inter-500.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(fonts/Inter-600.ttf);font-weight:600}
@font-face{font-family:Inter;src:url(fonts/Inter-700.ttf);font-weight:700}
@font-face{font-family:Inter;src:url(fonts/Inter-800.ttf);font-weight:800}
@font-face{font-family:'Instrument Serif';src:url(fonts/InstrumentSerif-Italic.ttf);font-style:italic}
@font-face{font-family:'Instrument Serif';src:url(fonts/InstrumentSerif-Regular.ttf);font-style:normal}

/* ---- BRAND TOKENS ---- */
:root{ --accent:#FF821C; --text:#0A0A0A; }

html,body{margin:0;padding:0;background:#161616;overflow:hidden}
body.render{background:#fff}
#viewport{position:absolute;left:50%;top:0;transform-origin:0 0}
body.render #viewport{left:0}
/* one continuous white-gradient world; the 3D camera flies across it */
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;
  background:
    radial-gradient(ellipse 70% 45% at 50% 42%, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 100%),
    radial-gradient(ellipse 90% 60% at 50% 110%, rgba(255,130,28,.06) 0%, rgba(255,130,28,0) 70%),
    linear-gradient(180deg,#FFFFFF 0%,#F7F6F4 60%,#EEECE9 100%);
  font-family:Inter,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased;
  perspective:2200px;perspective-origin:540px 960px}
#world{position:absolute;left:540px;top:960px;width:0;height:0;transform-style:preserve-3d;transform-origin:0 0}
.panel{position:absolute;width:1080px;height:1920px;transform-style:preserve-3d;visibility:hidden}
.p3{transform-style:preserve-3d}
#fade{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

.abs{position:absolute}
.ctr{position:absolute;transform:translate(-50%,-50%)}
.line{position:absolute;left:0;width:1080px;text-align:center;white-space:pre;line-height:1.12}
.sans{font-family:Inter,sans-serif}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
.ib,.grp,.ch{display:inline-block}

/* gradient type */
.tg-dark{background:linear-gradient(180deg,#5C5C5C 0%,#1E1E1E 50%,#000 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tg-acc{background:linear-gradient(180deg,#FFC685 0%,#FF8C26 45%,#E44E00 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tg-gray{background:linear-gradient(180deg,#8C8C8C 0%,#4E4E4E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tg-white{background:linear-gradient(180deg,#FFFFFF 0%,#FFF1E4 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
/* type glow */
.gl-dark{filter:drop-shadow(0 0 16px rgba(255,140,40,.22)) drop-shadow(0 8px 14px rgba(0,0,0,.16))}
.gl-acc{filter:drop-shadow(0 0 10px rgba(255,130,28,.55)) drop-shadow(0 0 30px rgba(255,130,28,.35))}
.gl-gray{filter:drop-shadow(0 4px 10px rgba(0,0,0,.10))}
.gl-white{filter:drop-shadow(0 0 8px rgba(255,255,255,.7))}

.glow{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,130,28,.26),rgba(255,130,28,.09) 55%,rgba(255,130,28,0))}
.card{position:absolute;width:330px;border-radius:24px;padding:22px 24px;box-sizing:border-box;font-size:17px;line-height:1.35;
  background:linear-gradient(160deg,#FFFFFF 0%,#FAFAFA 60%,#F1F1F1 100%);
  box-shadow:0 30px 60px rgba(20,10,0,.12),0 6px 14px rgba(20,10,0,.06),inset 0 1px 0 #fff;border:1px solid rgba(0,0,0,.05)}
.pill{position:relative;white-space:nowrap;font-size:38px;font-weight:500;padding:18px 40px;border-radius:999px;box-sizing:border-box;letter-spacing:-.02em}
.pill.f{background:linear-gradient(135deg,#FFB862 0%,#FF821C 48%,#E65000 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -4px 10px rgba(150,45,0,.25),0 16px 34px rgba(255,115,20,.38)}
.pill.o{border:3px solid transparent;
  background:linear-gradient(180deg,#FFFFFF,#F1F1F1) padding-box,linear-gradient(135deg,#5A5A5A,#000) border-box;
  box-shadow:0 12px 28px rgba(0,0,0,.09)}
.svc{position:absolute;width:860px;height:216px;border-radius:46px;box-sizing:border-box;padding:0 40px;display:flex;align-items:center;gap:38px;
  background:linear-gradient(160deg,#FFFFFF 0%,#FAFAFA 60%,#F1F1F1 100%);
  box-shadow:0 30px 60px rgba(20,10,0,.12),0 6px 14px rgba(20,10,0,.06),inset 0 1px 0 #fff;border:1px solid rgba(0,0,0,.05)}
.cal{position:absolute;width:768px;height:620px;border-radius:48px;
  background:linear-gradient(160deg,#FFFFFF 0%,#FBFAF9 60%,#F2F1EF 100%);
  box-shadow:0 40px 80px rgba(20,10,0,.14),0 8px 18px rgba(20,10,0,.06),inset 0 1px 0 #fff;border:1px solid rgba(0,0,0,.05)}
.cell{position:relative;width:84px;height:84px;border-radius:22px;background:#F2F1EE;box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
.cell .num{position:absolute;left:12px;top:8px;font-size:18px;font-weight:500;color:#B4B4B4}
.cell .ck{position:absolute;inset:0;border-radius:22px;display:flex;align-items:center;justify-content:center;opacity:0;
  background:linear-gradient(135deg,#FFB862 0%,#FF821C 50%,#E65000 100%);
  box-shadow:0 8px 18px rgba(255,115,20,.35),inset 0 2px 0 rgba(255,255,255,.45)}
.tile{position:relative;flex:none;border-radius:28%;display:flex;align-items:center;justify-content:center;box-sizing:border-box;
  background:linear-gradient(135deg,#FFE2BC 0%,#FFA048 18%,#F06A10 40%,#FFB060 58%,#E05A00 78%,#9A3300 100%);
  box-shadow:inset 0 3px 0 rgba(255,255,255,.55),inset 0 -6px 14px rgba(120,35,0,.35),0 20px 40px rgba(255,110,20,.32)}
.tile svg{filter:drop-shadow(0 1px 1px rgba(90,25,0,.5)) drop-shadow(0 0 8px rgba(255,255,255,.6))}
.frame{position:absolute;width:420px;height:680px;border-radius:40px;overflow:hidden;
  box-shadow:0 40px 80px rgba(40,15,0,.22),0 8px 18px rgba(20,10,0,.10),0 0 0 8px #fff}
.fill{left:0;top:0;width:100%;height:100%}
.chip{padding:8px 16px;border-radius:12px;font-size:22px;font-weight:700;letter-spacing:.12em}
.bar{border-radius:14px 14px 6px 6px;background:linear-gradient(180deg,#FFBA66 0%,#FF821C 45%,#C94400 100%);
  box-shadow:inset 0 2px 0 rgba(255,255,255,.45),0 14px 28px rgba(255,110,20,.3)}
.recbtn{width:320px;height:320px;border-radius:50%;background:linear-gradient(160deg,#FFFFFF,#ECEAE7);
  box-shadow:0 30px 60px rgba(20,10,0,.16),inset 0 2px 0 #fff,inset 0 -6px 14px rgba(0,0,0,.06),0 0 0 3px rgba(0,0,0,.05)}
.reccore{width:180px;height:180px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFD3A0 0%,#FF821C 45%,#B83C00 100%);
  box-shadow:0 10px 26px rgba(255,100,10,.5),inset 0 3px 0 rgba(255,255,255,.45)}
.chk{width:52px;height:52px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;flex:none;
  background:linear-gradient(135deg,#FFB862,#FF821C 50%,#E65000);box-shadow:0 6px 14px rgba(255,115,20,.35)}
.slot{width:212px;height:100px;border-radius:26px;display:flex;align-items:center;justify-content:center;font-size:36px;font-weight:600;
  color:#2A2A2A;background:#F2F1EE;border:3px solid #E4E2DF;box-sizing:border-box}
.slot.on{color:#fff;border-color:transparent;background:linear-gradient(135deg,#FFB862,#FF821C 50%,#E65000);box-shadow:0 12px 26px rgba(255,115,20,.4)}
.bookbtn{width:684px;height:120px;border-radius:60px;display:flex;align-items:center;justify-content:center;font-size:42px;font-weight:600;letter-spacing:-.02em;
  background:linear-gradient(135deg,#2E2E2E 0%,#0A0A0A 55%,#000 100%);box-shadow:inset 0 2px 0 rgba(255,255,255,.25),0 18px 36px rgba(0,0,0,.25)}
#ui{position:fixed;left:0;right:0;bottom:0;padding:10px 16px;background:rgba(0,0,0,.6);color:#eee;
  font:13px Inter,sans-serif;display:flex;gap:12px;align-items:center}
#ui input{flex:1}
body.render #ui{display:none}
</style>
</head>
<body>
<!-- shared gradients (referenced by every inline SVG) -->
<svg width="0" height="0" style="position:absolute"><defs id="defs">
  <linearGradient id="gAcc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFBA66"/><stop offset=".5" stop-color="#FF821C"/><stop offset="1" stop-color="#DD4A00"/></linearGradient>
  <linearGradient id="gAccV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFBC6B"/><stop offset=".5" stop-color="#FF851F"/><stop offset="1" stop-color="#E04C00"/></linearGradient>
  <linearGradient id="gDark" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#555"/><stop offset=".55" stop-color="#161616"/><stop offset="1" stop-color="#000"/></linearGradient>
  <linearGradient id="gDarkV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A5A5A"/><stop offset=".5" stop-color="#1A1A1A"/><stop offset="1" stop-color="#000"/></linearGradient>
  <linearGradient id="gTrack" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2F2F2"/><stop offset="1" stop-color="#CFCFCF"/></linearGradient>
  <!-- metallic finishes -->
  <linearGradient id="gMetalAcc" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFE2BC"/><stop offset=".16" stop-color="#FFA048"/><stop offset=".34" stop-color="#F06A10"/>
    <stop offset=".48" stop-color="#FFC07E"/><stop offset=".56" stop-color="#FF8A2A"/><stop offset=".74" stop-color="#C94400"/>
    <stop offset=".9" stop-color="#F27420"/><stop offset="1" stop-color="#8E2E00"/></linearGradient>
  <linearGradient id="gMetalStroke" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFF0DC"/><stop offset=".3" stop-color="#FF8A2A"/><stop offset=".55" stop-color="#FFD2A0"/>
    <stop offset=".8" stop-color="#D24A00"/><stop offset="1" stop-color="#FFB46A"/></linearGradient>
  <linearGradient id="gBevel" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFFFFF" stop-opacity=".95"/><stop offset=".35" stop-color="#FFFFFF" stop-opacity=".15"/>
    <stop offset=".65" stop-color="#5A1A00" stop-opacity=".1"/><stop offset="1" stop-color="#3A0F00" stop-opacity=".6"/></linearGradient>
  <linearGradient id="gGun" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#1A1A1A"/><stop offset=".25" stop-color="#6E6E6E"/><stop offset=".4" stop-color="#2A2A2A"/>
    <stop offset=".7" stop-color="#0C0C0C"/><stop offset=".85" stop-color="#555"/><stop offset="1" stop-color="#050505"/></linearGradient>
  <linearGradient id="gSheen" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".75"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
  <linearGradient id="gHandMetal" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#050505"/><stop offset=".38" stop-color="#3C3C3C"/><stop offset=".49" stop-color="#EDEDED"/>
    <stop offset=".53" stop-color="#5A5A5A"/><stop offset="1" stop-color="#000"/></linearGradient>
  <linearGradient id="gChrome" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#9A9A9A"/><stop offset=".45" stop-color="#1A1A1A"/><stop offset=".55" stop-color="#E0E0E0"/><stop offset="1" stop-color="#111"/></linearGradient>
  <linearGradient id="gArcMetal" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#FFE7C8"/><stop offset=".25" stop-color="#FF8A26"/><stop offset=".5" stop-color="#FFC27E"/>
    <stop offset=".75" stop-color="#E45200"/><stop offset="1" stop-color="#FF9A40"/></linearGradient>
  <radialGradient id="gCap" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFD3A0"/><stop offset=".45" stop-color="#FF821C"/><stop offset="1" stop-color="#B83C00"/></radialGradient>
</defs></svg>
<div id="viewport">
  <div id="stage">
    <div id="world"></div>
    <div id="fade"></div>
  </div>
</div>
<div id="ui">
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="tc">0.00s</span>
</div>
<audio id="aud" src="out/audio.wav" preload="auto"></audio>
<script src="timeline.js"></script>
<script src="motion.js"></script>
</body>
</html>
