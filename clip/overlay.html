<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Clip Overlay</title>
<style>
@font-face{font-family:Inter;src:url(fonts/Inter-500.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(fonts/Inter-600.ttf);font-weight:600}
@font-face{font-family:Inter;src:url(fonts/Inter-700.ttf);font-weight:700}
@font-face{font-family:Inter;src:url(fonts/Inter-800.ttf);font-weight:800}
@font-face{font-family:'Instrument Serif';src:url(fonts/InstrumentSerif-Italic.ttf);font-style:italic}

/* ---- BRAND TOKENS (same as video/index.html) ---- */
:root{ --accent:#FF821C; --text:#0A0A0A; }

html,body{margin:0;padding:0;background:transparent;overflow:hidden}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:Inter,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
/* the white-gradient world, only drawn in the background layer */
body.bg #stage{background:
    radial-gradient(ellipse 70% 45% at 50% 42%, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 100%),
    radial-gradient(ellipse 90% 60% at 50% 110%, rgba(255,130,28,.07) 0%, rgba(255,130,28,0) 70%),
    linear-gradient(180deg,#FFFFFF 0%,#F7F6F4 60%,#EEECE9 100%)}
.abs{position:absolute}
.glow{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,130,28,.20),rgba(255,130,28,.07) 55%,rgba(255,130,28,0))}

/* video card: shadow + body live in the bg layer, the video is composited into the hole */
.card{position:absolute;border-radius:44px}
.card.shadow{background:#1a1612;box-shadow:0 46px 90px rgba(30,14,0,.20),0 12px 24px rgba(30,14,0,.10),0 0 0 1px rgba(0,0,0,.04),0 0 70px rgba(255,130,28,.14)}
.card.rim{box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.22),inset 0 2px 0 rgba(255,255,255,.18)}
.vignette{position:absolute;border-radius:44px;background:
    linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 22%,rgba(0,0,0,0) 74%,rgba(0,0,0,.30) 100%)}

/* gradient type */
.tg-dark{background:linear-gradient(180deg,#5C5C5C 0%,#1E1E1E 50%,#000 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tg-acc{background:linear-gradient(180deg,#FFC685 0%,#FF8C26 45%,#E44E00 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tg-gray{background:linear-gradient(180deg,#8C8C8C 0%,#4E4E4E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.gl-dark{filter:drop-shadow(0 0 16px rgba(255,140,40,.20)) drop-shadow(0 8px 14px rgba(0,0,0,.14))}
.gl-acc{filter:drop-shadow(0 0 10px rgba(255,130,28,.55)) drop-shadow(0 0 30px rgba(255,130,28,.35))}
.sans{font-family:Inter,sans-serif}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400}
.ib,.grp,.ch,.w{display:inline-block}

.head{position:absolute;left:0;width:1080px;text-align:center;white-space:pre;line-height:1.1;font-size:70px;font-weight:600;letter-spacing:-.035em}
.head .serif{font-size:86px;letter-spacing:-.01em;line-height:.9}

.cap{position:absolute;left:40px;width:1000px;text-align:center;white-space:nowrap;font-size:76px;font-weight:800;letter-spacing:-.035em;line-height:1.1}
.cap .w{margin:0 .12em;transform-origin:50% 70%}
.cap .w.serif{font-size:92px;font-weight:400;letter-spacing:-.01em;margin:0 .1em}

.tag{position:absolute;display:flex;align-items:center;gap:14px;padding:14px 26px 14px 18px;border-radius:999px;
  background:rgba(14,12,10,.46);backdrop-filter:blur(10px);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 10px 24px rgba(0,0,0,.18);
  color:#fff;font-size:28px;font-weight:600;letter-spacing:-.01em;white-space:nowrap}
.tag .dot{width:14px;height:14px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFD3A0,#FF821C 45%,#B83C00);
  box-shadow:0 0 10px rgba(255,130,28,.9),0 0 22px rgba(255,130,28,.6)}
.tag .sub{color:rgba(255,255,255,.62);font-weight:500}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gAcc" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#FFBA66"/><stop offset=".5" stop-color="#FF821C"/><stop offset="1" stop-color="#DD4A00"/></linearGradient>
</defs></svg>
<div id="stage"></div>
<script src="clip_data.js"></script>
<script src="overlay.js"></script>
</body>
</html>
