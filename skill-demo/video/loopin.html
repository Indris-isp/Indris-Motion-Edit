<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Loopin launch film</title>
<style>
@font-face{font-family:Inter;src:url(../../video/fonts/Inter-400.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(../../video/fonts/Inter-500.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(../../video/fonts/Inter-600.ttf);font-weight:600}
@font-face{font-family:Inter;src:url(../../video/fonts/Inter-700.ttf);font-weight:700}
@font-face{font-family:Inter;src:url(../../video/fonts/Inter-800.ttf);font-weight:800}
:root{--acc:#2F6BFF;--ink:#0B0D12;--mut:#8A90A0;--red:#FF4D4F}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#fff;font-family:Inter,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
.scene{position:absolute;inset:0;overflow:hidden;display:none;will-change:transform,filter}
.cam{position:absolute;inset:0;transform-origin:960px 540px}
.abs{position:absolute}
.ctr{position:absolute;transform:translate(-50%,-50%)}
.blob{position:absolute;border-radius:50%;filter:blur(90px);background:radial-gradient(circle,#9DBBFF 0%,rgba(157,187,255,0) 70%)}
.rays{position:absolute;left:0;right:0;bottom:0;filter:blur(18px);
  background:repeating-linear-gradient(90deg,rgba(47,107,255,0) 0 40px,rgba(47,107,255,.55) 40px 70px,rgba(47,107,255,.1) 70px 120px,rgba(91,140,255,.7) 120px 140px);
  -webkit-mask-image:linear-gradient(0deg,#000 0%,rgba(0,0,0,.6) 40%,transparent 100%)}
.head{font-weight:600;letter-spacing:-.045em;line-height:1.02;white-space:pre}
.acc{color:var(--acc)}
.card{background:#fff;border-radius:22px;box-shadow:0 30px 80px -20px rgba(30,50,110,.28),0 4px 14px rgba(30,50,110,.08)}
.pill{display:inline-flex;align-items:center;gap:10px;padding:10px 18px;border-radius:999px;background:#fff;font-weight:500;font-size:20px;white-space:nowrap;
  box-shadow:0 12px 30px -8px rgba(30,50,110,.25)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;border:3px solid #fff;flex:none;
  box-shadow:0 8px 20px -6px rgba(0,0,0,.3)}
.badge{background:var(--red);color:#fff;font-weight:700;border-radius:999px;padding:4px 12px;font-size:18px}
.icon{width:120px;height:120px;border-radius:30px;background:linear-gradient(160deg,#6FA0FF,#2F6BFF 60%,#1F4FD6);flex:none;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.6),inset 0 -6px 14px rgba(0,0,0,.18),0 24px 50px -12px rgba(47,107,255,.6);
  display:flex;align-items:center;justify-content:center}
.icon i{width:45%;height:45%;border-radius:50%;border:solid #0B0D12;border-width:calc(var(--s,120px)*.11);background:#fff;display:block}
.glyph{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:30px;flex:none;
  box-shadow:0 14px 30px -10px rgba(0,0,0,.35)}
.row{display:flex;align-items:center;gap:14px}
.ln{height:12px;border-radius:6px;background:#E7EBF3}
.tag{font-size:14px;font-weight:600;padding:5px 10px;border-radius:8px;white-space:nowrap}
.ch{display:inline-block;white-space:pre}
.cur{display:inline-block;width:.07em;height:.9em;background:var(--acc);border-radius:3px;vertical-align:-.08em;margin-left:.04em}
.num{font-variant-numeric:tabular-nums}
#flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:50}
</style>
</head>
<body>
<div id="stage"><div id="flash"></div></div>
<svg width="0" height="0" style="position:absolute"><defs id="fdefs"></defs></svg>
<script src="cues.js"></script>
<script>
'use strict';
const W = 1920, H = 1080, SC = CUES.scenes;
/* ---------- math ---------- */
const C = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const P = (t, a, b) => C((t - a) / (b - a));
const L = (a, b, p) => a + (b - a) * p;
const eo = p => p >= 1 ? 1 : 1 - Math.pow(2, -10 * p);              // expo out
const eio = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2; // cubic in-out
const ei = p => p * p * p;
const bo = p => { const c1 = 1.5, c3 = c1 + 1; return p <= 0 ? 0 : 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); }; // back out
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const vel = (f, t) => Math.abs(f(t + 1 / 60) - f(t - 1 / 60));        // displacement over one 30fps frame
/* ---------- DOM ---------- */
const stage = document.getElementById('stage'), fdefs = document.getElementById('fdefs');
function D(parent, cls, style, html) {
  const e = document.createElement('div'); if (cls) e.className = cls;
  if (style) for (const k in style) e.style[k] = typeof style[k] === 'number' && !/opacity|zIndex|flex|fontWeight|lineHeight/.test(k) ? style[k] + 'px' : style[k];
  if (html != null) e.innerHTML = html; parent.appendChild(e); return e;
}
let fid = 0;
function mkBlur() { // directional blur filter (SVG) → {url, set(bx,by)}
  const id = 'mb' + (fid++);
  fdefs.insertAdjacentHTML('beforeend', `<filter id="${id}" x="-50%" y="-50%" width="200%" height="200%" color-interpolation-filters="sRGB"><feGaussianBlur stdDeviation="0 0"/></filter>`);
  const g = fdefs.lastElementChild.firstElementChild;
  return { url: `url(#${id})`, set(bx, by) { g.setAttribute('stdDeviation', `${bx.toFixed(2)} ${by.toFixed(2)}`); } };
}
/* set transform/opacity/blur. o: x y s r rx ry o b (iso blur) bx by (directional) */
function S(e, o) {
  const c = e.classList.contains('ctr') ? 'translate(-50%,-50%) ' : '';
  e.style.transform = `${c}translate(${(o.x || 0).toFixed(2)}px,${(o.y || 0).toFixed(2)}px) rotateX(${o.rx || 0}deg) rotateY(${o.ry || 0}deg) rotate(${(o.r || 0).toFixed(2)}deg) scale(${(o.s == null ? 1 : o.s).toFixed(4)})`;
  if (o.o != null) { e.style.opacity = C(o.o).toFixed(3); e.style.visibility = o.o <= 0.001 ? 'hidden' : 'visible'; }
  let f = o.f || '';
  if (o.bx != null || o.by != null) {
    const bx = o.bx || 0, by = o.by || 0;
    if (bx > .15 || by > .15) { if (!e._mb) e._mb = mkBlur(); e._mb.set(bx, by); f += ' ' + e._mb.url; }
  } else if (o.b > .1) f += ` blur(${o.b.toFixed(2)}px)`;
  e.style.filter = f.trim() || 'none';
}
const AVC = [['#FFB86B','#F06A2A'],['#7C5CFF','#4B2FD6'],['#3DD6A0','#139B6E'],['#FF7AA8','#D63C77'],['#6FC3FF','#2386D6'],['#FFD36B','#E09A12']];
const av = (n, s, i) => `<div class="av" style="width:${s}px;height:${s}px;font-size:${s * .36}px;background:linear-gradient(135deg,${AVC[i % 6][0]},${AVC[i % 6][1]})">${n}</div>`;
const iconHTML = s => `<div class="icon" style="width:${s}px;height:${s}px;border-radius:${s * .25}px;--s:${s}px"><i></i></div>`;
/* typed text: segs [{t, cls}] → {el, chars, cur} ; type(p) reveals chars progressively */
function typed(parent, cls, style, segs, cursor = true) {
  const e = D(parent, cls, style); const chars = [];
  for (const s of segs) {
    const g = document.createElement('span'); if (s.cls) g.className = s.cls; e.appendChild(g);
    for (const ch of s.t) { if (ch === '\n') { g.appendChild(document.createElement('br')); continue; } const c = document.createElement('span'); c.className = 'ch'; c.textContent = ch; g.appendChild(c); chars.push(c); }
  }
  let cur = null; if (cursor) { cur = document.createElement('span'); cur.className = 'cur'; e.appendChild(cur); }
  return { el: e, chars, cur };
}
function typeP(T, p, t, curOn = true) { // p 0..1 progress; reveals chars, keeps cursor after last
  const n = p * T.chars.length;
  T.chars.forEach((c, i) => {
    const k = C(n - i);
    c.style.display = k > 0 ? 'inline-block' : 'none';
    c.style.opacity = (.25 + .75 * k).toFixed(3);
    c.style.filter = k < 1 ? `blur(${((1 - k) * 6).toFixed(2)}px)` : 'none';
    c.style.transform = `translateY(${((1 - k) * 8).toFixed(1)}px)`;
  });
  if (T.cur) {
    const typing = p > 0 && p < 1;
    T.cur.style.opacity = !curOn || p <= 0 ? 0 : typing ? 1 : (Math.floor(t * 2.6) % 2 ? 0 : 1);
  }
}
/* whole-line blur reveal */
function blurIn(e, t, a, b, o = {}) {
  const p = eo(P(t, a, b));
  S(e, Object.assign({ o: C((t - a) / ((b - a) * .4)), b: (1 - p) * (o.blur || 24), s: L(o.s0 || 1.06, 1, p), y: (1 - p) * (o.y || 0), x: (1 - p) * (o.x || 0) }, o.extra || {}));
}

/* ---------- scenes ---------- */
const scenes = [];
function scene(cfg) {
  const i = scenes.length, a = SC[i], b = SC[i + 1];
  const root = D(stage, 'scene', { background: cfg.bg || 'linear-gradient(180deg,#fff 0%,#F5F7FC 100%)', zIndex: i + 1 });
  const cam = D(root, 'cam'); const st = {};
  cfg.build(cam, st, root);
  scenes.push(Object.assign({ i, a, b, dur: b - a, root, cam, st }, cfg));
}
/* scene-level transitions on the root */
const TR = {
  whipL: { inn: 0, out: .22 }, // handled in applyTr
};
function applyTr(sc, lt) {
  const d = sc.dur; let o = { x: 0, y: 0, s: 1, o: 1, bx: 0, by: 0 };
  const I = sc.tin, O = sc.tout, ti = .3, to = .24;
  if (I && lt < ti) {
    const p = eo(lt / ti), q = 1 - p;
    if (I === 'whip') { o.x = q * 700; o.bx = q * 60; }
    if (I === 'up') { o.y = q * 500; o.by = q * 50; }
    if (I === 'zoom') { o.s = L(.82, 1, p); o.bx = o.by = q * 24; }
    if (I === 'fade') { o.o = C(lt / .2); o.bx = o.by = q * 30; o.s = L(1.06, 1, p); }
  }
  if (O && lt > d - to) {
    const p = ei(P(lt, d - to, d));
    if (O === 'whip') { o.x += -p * 800; o.bx += p * 70; }
    if (O === 'up') { o.y += -p * 600; o.by += p * 60; }
    if (O === 'zoom') { o.s *= L(1, 1.6, p); o.bx += p * 30; o.by += p * 30; o.o = 1 - p * .6; }
    if (O === 'fade') { o.o = 1 - p; o.bx += p * 30; o.by += p * 30; }
  }
  S(sc.root, o);
}

/* ===== 01 HOOK: 9:13 → 9:14 am ===== */
scene({ tout: 'whip', build(c, s) {
  s.b1 = D(c, 'blob', { width: 900, height: 600, left: -200, top: 730 });
  s.b2 = D(c, 'blob', { width: 700, height: 500, left: 1370, top: -200, opacity: .7 });
  s.clock = D(c, 'ctr head', { left: 960, top: 540, fontSize: '230px', lineHeight: 1.2, display: 'flex', alignItems: 'flex-start' },
    `<span>9:1</span><span style="display:block;position:relative;width:.62em;height:1.2em;overflow:hidden;-webkit-mask-image:linear-gradient(180deg,transparent 0%,#000 18%,#000 82%,transparent 100%)"><span class="dg" style="position:absolute;left:0;top:0;display:block"><span style="display:block;height:1.2em">3</span><span style="display:block;height:1.2em">4</span></span></span><span class="acc" style="font-weight:500">&nbsp;am</span>`);
  s.dg = s.clock.querySelector('.dg');
  s.notif = D(c, 'ctr card row', { left: 1500, top: 215, padding: '16px 22px', borderRadius: '18px' },
    `${av('MK', 54, 0)}<div><div style="font-size:15px;color:#8A90A0;font-weight:600">Client · 9:14</div><div style="font-size:22px;font-weight:600;white-space:nowrap">any update on the v2 feedback??</div></div>`);
  s.dot = D(c, 'ctr', { left: 1500, top: 120, width: 14, height: 14, borderRadius: '50%', background: 'var(--red)' });
}, update(t, s, c) {
  S(c, { s: L(1, 1.05, t / 2.5) });
  const p = eo(P(t, 0, .8));
  S(s.clock, { o: C(t / .3), b: (1 - p) * 36, s: L(1.14, 1, p) });
  const r = eio(P(t, .95, 1.25));
  s.dg.style.transform = `translateY(${-r * 1.2}em)`; s.dg.style.filter = `blur(${(Math.sin(r * Math.PI) * 7).toFixed(1)}px)`;
  const nx = tt => L(460, 0, bo(P(tt, 1.3, 1.8))), ny = tt => L(-140, 0, bo(P(tt, 1.3, 1.8)));
  S(s.notif, { x: nx(t), y: ny(t), r: L(10, -3, eo(P(t, 1.3, 1.8))), o: C((t - 1.3) * 6), bx: vel(nx, t) * .25, by: vel(ny, t) * .2 });
  S(s.dot, { x: 250, y: 50, s: bo(P(t, 1.7, 1.95)), o: P(t, 1.7, 1.75) });
} });

/* ===== 02 CHAOS: Feedback is everywhere ===== */
scene({ tin: 'whip', tout: 'zoom', build(c, s) {
  D(c, 'blob', { width: 1200, height: 700, left: 350, top: 200 });
  s.plane = D(c, 'abs', { left: 0, top: 0, width: 1920, height: 1080, transformOrigin: '50% 60%' });
  const srcs = [['#', '#7C5CFF'], ['@', '#FF6A3D'], ['✉', '#2386D6'], ['☎', '#19B36B']];
  const msgs = ['is this the final?', 'see my comments', 'logo bigger pls', 'where’s v2??', 'can we revert?', 'feedback in doc', 'urgent!!', 'did you see this?'];
  s.cards = [];
  for (let r = 0; r < 6; r++) for (let k = 0; k < 9; k++) {
    const x = -60 + k * 240, y = -160 + r * 230, n = r * 9 + k, on = (n * 7) % 3 !== 0;
    const e = D(s.plane, 'abs', { left: x, top: y, width: 200, height: 190, borderRadius: '26px', padding: '18px',
      background: on ? '#fff' : 'rgba(255,255,255,.55)', boxShadow: on ? '0 20px 40px -14px rgba(30,50,110,.3)' : 'inset 0 0 0 2px #E3E8F3' });
    let bd = null;
    if (on) {
      const sr = srcs[n % 4];
      e.innerHTML = `<div class="glyph" style="width:46px;height:46px;font-size:22px;border-radius:12px;background:${sr[1]}">${sr[0]}</div><div style="font-size:17px;font-weight:600;margin-top:14px;line-height:1.2">${msgs[n % 8]}</div>`;
      if (n % 3 === 1) bd = D(e, 'abs badge', { right: -10, top: -10 }, String((n * 13) % 40 + 3));
    }
    const dist = Math.hypot(x + 100 - 1250, y + 95 - 480);
    s.cards.push({ e, bd, d: .08 + dist * .00055 + hash(n) * .12 });
  }
  s.wash = D(c, 'abs', { left: -200, top: 0, width: 1300, height: 1080, background: 'linear-gradient(90deg,#fff 0%,rgba(255,255,255,.97) 55%,rgba(255,255,255,0) 100%)', filter: 'blur(20px)' });
  s.l1 = D(c, 'ctr head', { left: 520, top: 478, fontSize: '124px' }, 'Feedback is');
  s.l2 = D(c, 'ctr head acc', { left: 520, top: 604, fontSize: '124px' }, 'everywhere.');
}, update(t, s, c) {
  s.plane.style.transform = `perspective(1800px) rotateX(18deg) rotateZ(-6deg) scale(${(1.15 + t * .03).toFixed(4)}) translateX(${(-t * 30).toFixed(1)}px)`;
  for (const k of s.cards) {
    const p = P(t, k.d, k.d + .4);
    k.e.style.opacity = C(p * 3).toFixed(3); k.e.style.transform = `scale(${L(.5, 1, bo(p)).toFixed(3)}) translateY(${((1 - eo(p)) * 40).toFixed(1)}px)`;
    if (k.bd) { const q = P(t, k.d + .45, k.d + .7); k.bd.style.transform = `scale(${bo(q).toFixed(3)})`; }
  }
  S(s.wash, { o: eo(P(t, .2, .6)) });
  for (const [e, a] of [[s.l1, .3], [s.l2, .44]]) {
    const fx = tt => L(520, 0, eo(P(tt, a, a + .42)));
    S(e, { x: fx(t), o: C((t - a) * 6), bx: Math.min(60, vel(fx, t) * .35) });
  }
} });

/* ===== 03 PAIN: 127 unread ===== */
scene({ tin: 'zoom', bg: '#000', build(c, s) {
  s.inner = D(c, 'abs', { inset: 0, background: '#fff' });
  D(s.inner, 'blob', { width: 900, height: 600, left: 500, top: 250 });
  const q = ['still waiting…', 'v2??', 'which file?', 'hello?', 'ETA?', 'missed this'];
  const pos = [[260, 200], [1480, 180], [230, 780], [1520, 800], [840, 880], [1100, 130]];
  s.bub = pos.map((p, i) => D(s.inner, 'abs row', { left: p[0], top: p[1], gap: '10px' }, `${av(['MK', 'JL', 'AS', 'TR', 'BN', 'EO'][i], 58, i)}<span class="pill" style="font-size:19px;padding:9px 15px">${q[i]}</span>`));
  s.big = D(s.inner, 'ctr head', { left: 960, top: 500, fontSize: '250px' }, '<span class="num">0</span> <span style="font-weight:500">unread</span>');
  s.num = s.big.querySelector('.num');
  s.pill = D(s.inner, 'ctr badge', { left: 1230, top: 655, fontSize: '40px', padding: '12px 30px', boxShadow: '0 20px 40px -10px rgba(255,77,79,.6)' }, '+38 today');
  s.dim = D(c, 'abs', { inset: 0, background: 'radial-gradient(ellipse at 50% 50%,rgba(6,12,34,.55),rgba(2,4,12,1))', opacity: 0 });
}, update(t, s, c) {
  S(c, { s: L(1, 1.06, t / 3) });
  const p = eo(P(t, .1, 1.15));
  s.num.textContent = String(Math.round(127 * p)).padStart(3, ' ');
  S(s.big, { o: C(t * 8), b: (1 - eo(P(t, 0, .3))) * 20 });
  const q = P(t, 1.2, 1.45);
  S(s.pill, { s: L(2.4, 1, bo(q)), r: L(-22, -6, eo(q)), o: C(q * 4) });
  s.bub.forEach((e, i) => { const d = .45 + i * .17, k = P(t, d, d + .35); S(e, { s: L(.4, 1, bo(k)), o: C(k * 4), x: Math.sin(t * 1.3 + i) * 10, y: Math.cos(t * 1.1 + i * 2) * 8 }); });
  const g = P(t, 2.0, 3.0);
  s.inner.style.filter = `grayscale(${eio(C(g * 1.6)).toFixed(2)})`;
  s.dim.style.opacity = eio(g).toFixed(3);
} });

/* ===== 04 TURN: dark flare draws the ring → icon ===== */
scene({ bg: '#000', build(c, s) {
  s.sky = D(c, 'abs', { inset: 0, background: 'radial-gradient(ellipse at 50% 50%,#0E2A6B 0%,#06112E 55%,#020611 100%)' });
  s.stars = []; for (let i = 0; i < 170; i++) { const z = (i % 5) / 3 + 1; s.stars.push({ e: D(c, 'abs', { left: (i * 137.5) % 1920, top: (i * 91.7) % 1080, width: z, height: z, borderRadius: '50%', background: '#fff' }), k: i }); }
  s.halo = D(c, 'ctr', { left: 960, top: 540, width: 700, height: 700, borderRadius: '50%', background: 'radial-gradient(circle,rgba(70,130,255,.45) 0%,rgba(47,107,255,0) 65%)' });
  c.insertAdjacentHTML('beforeend', `<svg class="abs" style="left:0;top:0" width="1920" height="1080"><defs>
    <filter id="rglow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <linearGradient id="arcg" x1="0" x2="1"><stop offset="0" stop-color="#2F6BFF" stop-opacity=".2"/><stop offset="1" stop-color="#CFE0FF"/></linearGradient></defs>
    <circle id="ring" cx="960" cy="540" r="120" fill="none" stroke="#9FC0FF" stroke-width="24" stroke-linecap="round" filter="url(#rglow)"/></svg>`);
  s.ring = c.querySelector('#ring');
  s.icon = D(c, 'ctr', { left: 960, top: 540 }, iconHTML(230));
  s.fl = D(c, 'abs', { left: 0, top: 0, width: 0, height: 0 });
  s.fh = D(s.fl, 'ctr', { left: 0, top: 0, width: 900, height: 3, background: 'linear-gradient(90deg,transparent,rgba(200,222,255,.95),transparent)' });
  s.fv = D(s.fl, 'ctr', { left: 0, top: 0, width: 3, height: 240, background: 'linear-gradient(0deg,transparent,rgba(200,222,255,.95),transparent)' });
  s.fc = D(s.fl, 'ctr', { left: 0, top: 0, width: 80, height: 80, borderRadius: '50%', background: 'radial-gradient(circle,#fff 0%,rgba(170,200,255,.85) 25%,rgba(47,107,255,0) 70%)' });
}, update(t, s, c) {
  s.sky.style.opacity = eo(P(t, 0, .5)).toFixed(3);
  S(c, { s: L(1.06, 1, eo(P(t, 0, 2.6))) });
  for (const st of s.stars) st.e.style.opacity = (P(t, .1, .7) * (.25 + .45 * (.5 + .5 * Math.sin(t * (1.5 + hash(st.k) * 3) + st.k)))).toFixed(3);
  const R = 120, CIRC = 2 * Math.PI * R;
  const dp = eio(P(t, .55, 1.6)), len = CIRC * dp, rot = -200 + 150 * eo(P(t, .55, 2.0));
  s.ring.setAttribute('stroke-dasharray', `${len.toFixed(1)} 2000`);
  s.ring.setAttribute('transform', `rotate(${rot.toFixed(2)} 960 540)`);
  const m = P(t, 1.55, 2.0);
  s.ring.style.opacity = (dp > 0 ? 1 - eo(m) : 0).toFixed(3);

  S(s.side2, { x: L(-610, 0, f2), y: L(125, 0, f2) + Math.cos(t * 1.5) * 6, r: L(0, 4, f2), o: P(t, 1.1, 1.25) });
  s.v1.textContent = Math.round(94 * eo(P(t, 1.2, 2.2))) + '%';
  s.v2.textContent = (4.9 * eo(P(t, 1.3, 2.3))).toFixed(1);
  const q = P(t, 1.9, 2.2); S(s.quote, { s: bo(q), o: q * 3 });
} });

/* ===== 11 SETUP: slot-reel → 02 minutes to set up ===== */
scene({ tin: 'fade', tout: 'fade', build(c, s) {

/* ---------- render ---------- */
function show(sc, lt) { sc.root.style.display = 'block'; applyTr(sc, lt); sc.update(lt, sc.st, sc.cam); }
window.renderAt = function (t) {
  document.getElementById('flash').style.opacity = 0;
  for (const sc of scenes) sc.root.style.display = 'none';
  scenes.forEach((sc, i) => {
    const lt = t - sc.a;
    if (lt >= 0 && lt < sc.dur) {
      if (sc.under && lt < sc.under) { const pv = scenes[i - 1]; show(pv, pv.dur - 0.001); }
      show(sc, lt);
    }
  });
};
document.fonts.ready.then(() => {
  for (const sc of scenes) if (sc.measure) { sc.root.style.display = 'block'; sc.measure(sc.st); sc.root.style.display = 'none'; }
  window.renderAt(0); window.READY = true;
});
