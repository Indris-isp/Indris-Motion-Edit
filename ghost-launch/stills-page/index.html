<title>Ghost Launch Stills</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: a single review column of 16:9 stills, each captioned with scene, timecode and what happens. */
:root { --bg:#f4f3f7; --paper:#fff; --ink:#112220; --mute:#5d6472; --line:#e1e0e8; --acc:#7a33ef; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg:#0f1012; --paper:#17181b; --ink:#eceef0; --mute:#9ea3ad; --line:#2a2c31; --acc:#a777ff; color-scheme:dark } }
:root[data-theme="dark"] { --bg:#0f1012; --paper:#17181b; --ink:#eceef0; --mute:#9ea3ad; --line:#2a2c31; --acc:#a777ff; color-scheme:dark }
body { background:var(--bg); color:var(--ink); font:15px/1.55 "Inter",system-ui,sans-serif; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px)); padding-block:36px 80px; }
.wrap { max-width:1100px; margin:0 auto; display:grid; gap:28px; }
h1 { margin:0; font-size:clamp(30px,4.6vw,48px); letter-spacing:-0.035em; line-height:1.05; text-wrap:balance; }
.lede { color:var(--mute); margin:0; max-width:68ch; font-size:16px; }
.eyebrow { font:500 11px "JetBrains Mono",monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--mute); }
nav { display:flex; flex-wrap:wrap; gap:6px; }
nav a { font:500 12px "JetBrains Mono",monospace; color:var(--ink); text-decoration:none; padding:5px 9px; border:1px solid var(--line); border-radius:6px; background:var(--paper); }
nav a:hover, nav a:focus-visible { border-color:var(--acc); color:var(--acc); }
figure { margin:0; background:var(--paper); border:1px solid var(--line); border-radius:12px; overflow:hidden; scroll-margin-top:16px; }
figure img { display:block; width:100%; height:auto; aspect-ratio:16/9; background:#eee; }
figcaption { padding:14px 18px 16px; display:grid; gap:4px; }
.cap-head { display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:baseline; }
.cap-head b { font-size:17px; letter-spacing:-0.015em; }
.tc { font:500 12px "JetBrains Mono",monospace; color:var(--acc); }
figcaption p { margin:0; color:var(--mute); }
</style>
<div class="wrap">
  <header style="display:grid;gap:12px">
    <span class="eyebrow">Ghost launch video · storyboard v4 · key-frame stills</span>
    <h1>18 stills from the 45-second build</h1>
    <p class="lede">Rendered from the Remotion project at 1920×1080. Each still is one key moment of a scene. Scenes with two moments show both.</p>
    <nav><a href="#01_hook">01</a><a href="#02_who">02</a><a href="#03_reach">03</a><a href="#04_fees">04</a><a href="#05a_tools">05a</a><a href="#05b_tools">05b</a><a href="#06a_star">06a</a><a href="#06b_meet">06b</a><a href="#07a_publish">07a</a><a href="#07b_inbox">07b</a><a href="#08a_faces">08a</a><a href="#08b_keep">08b</a><a href="#09a_wall">09a</a><a href="#09b_dash">09b</a><a href="#10_proof">10</a><a href="#11a_dial">11a</a><a href="#11b_payoff">11b</a><a href="#12_cta">12</a></nav>
  </header>
  <figure id="01_hook">
    <img src="img/01_hook.jpg" alt="01 · Hook" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>01 · Hook</b><span class="tc">0:00–0:03.5</span></div><p>“You write. People read.” Typed with a cursor, a live reader counter, floating avatars with speech bubbles.</p></figcaption>
  </figure>
  <figure id="02_who">
    <img src="img/02_who.jpg" alt="02 · Who it’s for" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>02 · Who it’s for</b><span class="tc">0:03.5–0:07</span></div><p>A grid of creator tiles blurs behind “You’re building an [faces] audience.”</p></figcaption>
  </figure>
  <figure id="03_reach">
    <img src="img/03_reach.jpg" alt="03 · Problem 1: rented reach" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>03 · Problem 1: rented reach</b><span class="tc">0:07–0:11</span></div><p>“Who actually sees your post?” A feed buries your post while the tilted Reach badge drops to 6%.</p></figcaption>
  </figure>
  <figure id="04_fees">
    <img src="img/04_fees.jpg" alt="04 · Problem 2: platform fees" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>04 · Problem 2: platform fees</b><span class="tc">0:11–0:15</span></div><p>$1,000 rolls down to $900 as the 10% slice falls away. Line: “Many platforms take a cut. Forever.”</p></figcaption>
  </figure>
  <figure id="05a_tools">
    <img src="img/05a_tools.jpg" alt="05 · Problem 3: too many tools (a)" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>05 · Problem 3: too many tools (a)</b><span class="tc">0:15–0:20</span></div><p>Five tool tiles with red price badges. The cursor drags a subscriber from Members to Email by hand.</p></figcaption>
  </figure>
  <figure id="05b_tools">
    <img src="img/05b_tools.jpg" alt="05 · Problem 3: too many tools (b)" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>05 · Problem 3: too many tools (b)</b></div><p>Tangled lines, the tiles jitter. “Five tools. Five bills. $121 a month.” Hard cut to black.</p></figcaption>
  </figure>
  <figure id="06a_star">
    <img src="img/06a_star.jpg" alt="06 · Meet Ghost (a)" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>06 · Meet Ghost (a)</b><span class="tc">0:20–0:24</span></div><p>Navy starfield. A sparkle draws a glowing ring, which becomes the Ghost orb.</p></figcaption>
  </figure>
  <figure id="06b_meet">
    <img src="img/06b_meet.jpg" alt="06 · Meet Ghost (b)" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>06 · Meet Ghost (b)</b></div><p>Flash to white. The Ghost logo types in, then the one-line definition of what Ghost is.</p></figcaption>
  </figure>
  <figure id="07a_publish">
    <img src="img/07a_publish.jpg" alt="07 · Fix 1: publish & send (a)" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>07 · Fix 1: publish & send (a)</b><span class="tc">0:24–0:28</span></div><p>Ghost editor on a 3D laptop. The camera pushes into the Publish & send button with background blur.</p></figcaption>
  </figure>
  <figure id="07b_inbox">
    <img src="img/07b_inbox.jpg" alt="07 · Fix 1: publish & send (b)" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>07 · Fix 1: publish & send (b)</b></div><p>Fast blurred pan to inboxes. “Delivered to 2,480 subscribers”, then “Straight to [faces] every inbox.”</p></figcaption>
  </figure>
  <figure id="08a_faces">
    <img src="img/08a_faces.jpg" alt="08 · Fix 2: paid memberships (a)" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>08 · Fix 2: paid memberships (a)</b><span class="tc">0:28–0:32</span></div><p>A wall of grey faces. The Paid memberships switch flips on, and readers turn to colour with $5/mo tags.</p></figcaption>
  </figure>
  <figure id="08b_keep">
    <img src="img/08b_keep.jpg" alt="08 · Fix 2: paid memberships (b)" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>08 · Fix 2: paid memberships (b)</b></div><p>A circular wipe reveals the tiers. The slice snaps back to $1,000, with “0% payment fees” and “You keep 100%.”</p></figcaption>
  </figure>
  <figure id="09a_wall">
    <img src="img/09a_wall.jpg" alt="09 · Fix 3: one dashboard (a)" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>09 · Fix 3: one dashboard (a)</b><span class="tc">0:32–0:36</span></div><p>A purple wall of repeated words with “Your whole business, in one place.”</p></figcaption>
  </figure>
  <figure id="09b_dash">
    <img src="img/09b_dash.jpg" alt="09 · Fix 3: one dashboard (b)" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>09 · Fix 3: one dashboard (b)</b></div><p>The wall sinks into a curved horizon. A white panel morphs into the Ghost dashboard, and stat cards float in 3D.</p></figcaption>
  </figure>
  <figure id="10_proof">
    <img src="img/10_proof.jpg" alt="10 · Proof" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>10 · Proof</b><span class="tc">0:36–0:39</span></div><p>$100,000,000+ earned each year by publications on Ghost. Value chips slide through a highlighted strip.</p></figcaption>
  </figure>
  <figure id="11a_dial">
    <img src="img/11a_dial.jpg" alt="11 · Payoff (a)" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>11 · Payoff (a)</b><span class="tc">0:39–0:42</span></div><p>A number wheel turns from 10 to 0, then “% fees on what your readers pay”.</p></figcaption>
  </figure>
  <figure id="11b_payoff">
    <img src="img/11b_payoff.jpg" alt="11 · Payoff (b)" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>11 · Payoff (b)</b></div><p>“Your audience. Your revenue.”</p></figcaption>
  </figure>
  <figure id="12_cta">
    <img src="img/12_cta.jpg" alt="12 · Logo + CTA" loading="lazy" width="1600" height="900">
    <figcaption><div class="cap-head"><b>12 · Logo + CTA</b><span class="tc">0:42–0:45</span></div><p>Ghost logo, “Turn your audience into a business.”, Start publishing now and Try free for 14 days, ghost.org.</p></figcaption>
  </figure>
</div>
