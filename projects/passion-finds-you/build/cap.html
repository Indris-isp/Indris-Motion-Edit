<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="caption-style.css">
<style>
html,body{margin:0;background:transparent}
.fm-stage{--H:1920px;--U:1000px;width:1080px;height:1920px;background:transparent;font-family:"Inter Display","Inter",sans-serif}
.fm-cap{--cap-y:.42}
.fm-line{filter:none!important}                       /* no drop shadow */
.fm-cap.is-two .fm-line+.fm-line{margin-top:-.10em}  /* two equal lines: normal leading */
</style></head><body><div class="fm-stage" id="st"></div><script>
function sky(seed){const s=`<svg xmlns='http://www.w3.org/2000/svg' width='1600' height='900'><filter id='c' x='0' y='0' width='100%' height='100%'><feTurbulence type='fractalNoise' baseFrequency='0.0032 0.0055' numOctaves='5' seed='${seed}'/><feColorMatrix type='matrix' values='1.59 0 0 0 0.285 0.84 0 0 0 0.622 0.30 0 0 0 0.865 0 0 0 0 1'/></filter><rect width='100%' height='100%' filter='url(#c)'/></svg>`;return `url("data:image/svg+xml;utf8,${encodeURIComponent(s)}")`}
const c=JSON.parse(decodeURIComponent(location.hash.slice(1)));const st=document.getElementById('st');
st.style.setProperty('--sky-tex',sky(7));
if(c.scale) st.style.setProperty('--U',(1000*c.scale)+'px');
const cls={standard:'fm-standard',italic:'fm-italic',emphasis:'fm-emphasis',hero:'fm-hero',heromax:'fm-heromax'};
const cap=document.createElement('div');cap.className='fm-cap'+(c.stack?' is-stack':'')+(c.two?' is-two':'');
if(c.capY) cap.style.setProperty('--cap-y',c.capY);
for(const l of c.lines){const s=document.createElement('span');s.className='fm-line '+cls[l.tier];s.textContent=l.text;
 if(l.italic) s.style.fontStyle='italic';
 if(l.size) s.style.fontSize=`calc(var(--U) * ${l.size})`;
 cap.appendChild(s)}
st.appendChild(cap);
window.ready=document.fonts.ready.then(()=>{for(const e of document.querySelectorAll('.fm-line')){const w=e.getBoundingClientRect().width;if(w>950)e.style.fontSize=(parseFloat(getComputedStyle(e).fontSize)*950/w)+'px'}return true});
</script></body></html>
