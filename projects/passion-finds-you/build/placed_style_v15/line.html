html,body{margin:0;background:transparent}
#t{position:absolute;left:40px;top:40px;white-space:nowrap;color:#fff;font-family:"SatoshiR",sans-serif;line-height:1.15;padding:0.1em 0.12em 0.22em}
</style></head><body><span id="t"></span><script>
window.wordEdges=()=>{   // x of each word's start/end, relative to the span's left edge
 const e=document.getElementById('t'), n=e.firstChild, txt=n.textContent, L=e.getBoundingClientRect().left, out=[]; const rg=document.createRange();
 const re=/\S+/g; let m; while((m=re.exec(txt))){ rg.setStart(n,m.index); rg.setEnd(n,m.index+m[0].length); const r=rg.getBoundingClientRect(); out.push([r.left-L, r.right-L]); } return out; };
window.setLine=(o)=>{const e=document.getElementById('t');e.textContent=o.text;e.style.fontSize=o.size+'px';e.style.fontWeight=o.weight;e.style.letterSpacing=o.ls+'em';
 return document.fonts.load(o.weight+' '+o.size+'px SatoshiR').then(()=>document.fonts.ready).then(()=>{const r=e.getBoundingClientRect();return {x:r.x,y:r.y,w:r.width,h:r.height}})};
</script></body></html>
