<!doctype html>
<html><head><meta charset="utf-8">
<title>TeamBuildr styleframes</title>
<style>
@font-face{font-family:Figtree;src:url(assets/fonts/figtree-latin-400-normal.woff2);font-weight:400}
@font-face{font-family:Figtree;src:url(assets/fonts/figtree-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:Figtree;src:url(assets/fonts/figtree-latin-600-normal.woff2);font-weight:600}
@font-face{font-family:Figtree;src:url(assets/fonts/figtree-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Figtree;src:url(assets/fonts/figtree-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:'Instrument Serif';src:url(../../video/fonts/InstrumentSerif-Italic.ttf);font-style:italic}

/* TeamBuildr brand tokens, sampled from teambuildr.com (Nov 2026) */
:root{
  --bg:#FFFFFF; --bg2:#FFF6F0; --panel:#FFFFFF; --panel2:#F6F7FA; --line:#E6E8EE;
  --text:#1E212E; --muted:#6E7487; --accent:#FF6A33; --accent2:#FF9000; --deep:#FF4500;
  --grad:linear-gradient(120deg,#FF4500 0%,#FF6A33 45%,#FF9A3D 100%);
  --good:#22B573; --warn:#FF9000; --bad:#E5384F; --paper:#FFFDF8; --ink:#1E212E;
  --shadow:0 30px 80px rgba(30,33,46,.12),0 4px 14px rgba(30,33,46,.06);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg)}
body{font-family:Figtree,sans-serif;color:var(--text)}
.stage{position:absolute;inset:0;overflow:hidden;
  background:radial-gradient(1500px 720px at 50% 115%, #FFCFB8 0%, #FFEDE3 42%, #FFFFFF 78%)}
.grid{position:absolute;inset:0;opacity:.6;
  background-image:linear-gradient(#F1E6DF 1px,transparent 1px),linear-gradient(90deg,#F1E6DF 1px,transparent 1px);
  background-size:64px 64px;mask-image:radial-gradient(900px 600px at 50% 40%,#000 10%,transparent 75%)}
.c{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%)}
.g{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.h{font-weight:800;letter-spacing:-0.035em;line-height:1.04;text-align:center}
.h em,.cap em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;padding-right:.04em}
.kicker{font-weight:700;font-size:22px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.win{background:var(--panel);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow:hidden}
.bar{height:44px;background:#FBFBFD;display:flex;align-items:center;gap:8px;padding:0 18px;border-bottom:1px solid var(--line)}
.bar i{width:12px;height:12px;border-radius:50%;background:#DADDE5;display:block}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 16px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-weight:600;font-size:18px}
.cap{position:absolute;left:50%;transform:translateX(-50%);bottom:96px;font-weight:800;font-size:56px;letter-spacing:-0.03em;white-space:nowrap}
.cursor{position:absolute;width:34px;height:40px;filter:drop-shadow(0 4px 8px rgba(30,33,46,.25))}
.phone{width:340px;height:700px;border-radius:52px;background:#1E212E;padding:12px;box-shadow:var(--shadow)}
.screen{width:100%;height:100%;border-radius:42px;background:#fff;overflow:hidden;position:relative}
.btn{background:var(--grad);color:#fff;box-shadow:0 14px 30px rgba(255,90,31,.35)}
.ph{position:absolute;right:96px;top:60px;font-size:15px;font-weight:600;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;opacity:.6}
</style></head>
<body><div class="stage" id="stage"><div class="grid"></div></div>
<script>
const CUR = `<svg class="cursor" viewBox="0 0 34 40"><path d="M3 2 L3 32 L11 25 L16 37 L22 34 L17 23 L28 23 Z" fill="#1E212E" stroke="#fff" stroke-width="2.5" stroke-linejoin="round"/></svg>`;
const cur = (x,y)=>CUR.replace('class="cursor"',`class="cursor" style="left:${x}px;top:${y}px"`);
const PH = `<div class="ph">UI placeholder · rebuilt from TeamBuildr Figma</div>`;
const MARK = `<div class="mark"><svg width="58" height="58" viewBox="0 0 58 58"><rect x="4" y="22" width="8" height="14" rx="2" fill="#fff"/><rect x="46" y="22" width="8" height="14" rx="2" fill="#fff"/><rect x="12" y="16" width="7" height="26" rx="2" fill="#fff"/><rect x="39" y="16" width="7" height="26" rx="2" fill="#fff"/><rect x="19" y="26" width="20" height="6" rx="2" fill="#fff"/></svg></div>`;

function sheet(title,x,y,r,w=420,h=300,z=1){
  let rows='';
  for(let i=0;i<9;i++){rows+='<div style="display:flex;border-top:1px solid #D9DEE6">';
    for(let j=0;j<5;j++){const v=[ '75%','80%','3x5','225','#REF!','245','85%','5x3','—','265'][(i*5+j*3)%10];
      const red=v==='#REF!';rows+=`<div style="flex:1;height:28px;border-left:1px solid #D9DEE6;font:500 13px Figtree;color:${red?'#D21F3C':'#334'};background:${red?'#FFE3E6':'transparent'};padding:6px 8px">${(i+j)%3?v:''}</div>`}
    rows+='</div>'}
  return `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px;transform:rotate(${r}deg);background:#fff;border-radius:10px;box-shadow:0 24px 60px rgba(30,33,46,.16);overflow:hidden">
    <div style="height:38px;background:#1F7A45;color:#fff;font:600 15px Figtree;display:flex;align-items:center;padding:0 14px;gap:10px"><span style="width:14px;height:14px;background:#fff;border-radius:3px;opacity:.9"></span>${title}</div>${rows}</div>`;
}

const F = {};

/* ---------- A1 · Spreadsheet wall ---------- */
F.A1 = ()=>`
  ${sheet('Football_Summer_v3.xlsx',60,-40,-6)}
  ${sheet('Maxes_FINAL_final.xlsx',520,-90,3)}
  ${sheet('Wk4_Lifts_PRINT.xlsx',980,-60,-2)}
  ${sheet('Soccer_InSeason.xlsx',1450,-10,5)}
  ${sheet('Track_Sprints_OLD.xlsx',60,820,4)}
  ${sheet('Volleyball_Maxes(2).xlsx',1460,800,-5)}
  ${sheet('Copy of Copy of Wk5.xlsx',520,880,-3)}
  ${sheet('Baseball_Off.xlsx',990,860,2)}
  <div style="position:absolute;inset:0;background:radial-gradient(760px 360px at 50% 50%,rgba(255,255,255,.97),rgba(255,247,242,.8) 68%,rgba(255,240,232,.2))"></div>
  <div class="c" style="text-align:center">
    <div class="h" style="font-size:112px;position:relative;z-index:2;white-space:nowrap">120 athletes. 6 teams.<br><em>One spreadsheet.</em></div>
  </div>`;

/* ---------- A2 · Manual loop ---------- */
F.A2 = ()=>{
  const paper=(x,y,r,extra='')=>`<div style="position:absolute;left:${x}px;top:${y}px;width:250px;height:330px;transform:rotate(${r}deg);background:var(--paper);border-radius:6px;box-shadow:0 16px 40px rgba(30,33,46,.14);padding:22px;color:var(--ink)">
    <div style="font:700 16px Figtree;margin-bottom:12px">WK 4 · LOWER A</div>
    ${['Back Squat','RDL','Split Squat','Nordic'].map((e,i)=>`<div style="display:flex;justify-content:space-between;border-bottom:1px solid #CFC9BC;padding:10px 0;font:500 14px Figtree">${e}<span style="font:italic 26px 'Instrument Serif';color:#1F3FAF;margin-top:-6px">${['275?','185','40s','x6'][i]}</span></div>`).join('')}
    ${extra}</div>`;
  return `
  <div style="position:absolute;left:96px;right:96px;top:150px;display:flex;justify-content:space-between">
    ${['01 · BUILD','02 · PRINT','03 · COLLECT & RE-TYPE'].map(t=>`<div class="kicker" style="width:520px;text-align:center">${t}</div>`).join('')}
  </div>
  <!-- beat 1 -->
  <div class="win" style="position:absolute;left:96px;top:220px;width:520px;height:520px;background:#fff;border-color:#ccc">
    <div style="height:44px;background:#1F7A45;color:#fff;font:600 16px Figtree;display:flex;align-items:center;padding:0 16px">Maxes_FINAL_final.xlsx</div>
    <div style="padding:14px 16px;font:500 15px 'JetBrains Mono',monospace;color:#334;border-bottom:1px solid #ddd">fx&nbsp;&nbsp;=Maxes!C14*0.8</div>
    ${[['Athlete','1RM','80%'],['J. Rivera','315','252'],['M. Chen','285','228'],['D. Brooks','—','<b style="color:#D21F3C">#REF!</b>'],['K. Owens','240','192'],['T. Patel','300','240']].map((r,i)=>`<div style="display:flex;border-bottom:1px solid #E3E6EB;${i==3?'background:#FFE3E6':''}">${r.map(c=>`<div style="flex:1;padding:16px;font:${i?500:700} 18px Figtree;color:#223">${c}</div>`).join('')}</div>`).join('')}
  </div>
  ${cur(500,560)}
  <!-- beat 2 -->
  <div style="position:absolute;left:700px;top:430px;width:520px;height:220px;background:linear-gradient(#F3F4F7,#DCDFE6);border-radius:22px;box-shadow:var(--shadow)">
    <div style="position:absolute;left:40px;right:40px;top:30px;height:16px;border-radius:8px;background:#0B0E13"></div>
    <div style="position:absolute;right:40px;bottom:30px;width:14px;height:14px;border-radius:50%;background:var(--good);box-shadow:0 0 12px var(--good)"></div>
  </div>
  ${paper(830,220,-4)}
  ${paper(870,250,3)}
  <!-- beat 3 -->
  <div style="position:absolute;left:1340px;top:240px;width:440px;height:520px;background:#D9A877;border-radius:18px;box-shadow:var(--shadow)">
    <div style="position:absolute;left:150px;top:-14px;width:140px;height:40px;border-radius:10px;background:#9AA0AE"></div>
  </div>
  ${paper(1400,280,-2,`<div style="position:absolute;right:30px;bottom:30px;width:110px;height:110px;border-radius:50%;border:10px solid rgba(120,80,40,.28)"></div>`)}
  <div style="position:absolute;left:1440px;top:690px;padding:10px 18px;border-radius:999px;background:rgba(255,77,94,.15);border:2px dashed var(--bad);color:var(--bad);font:700 20px Figtree">1 sheet missing · 3 unreadable</div>
  <div class="cap" style="bottom:110px">Build. Print. Collect. Re-type. <em>Every week.</em></div>`;
};

/* ---------- A3 · Program builder ---------- */
F.A3 = ()=>{
  const days=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
  const sess={0:['Lower Body A','var(--accent)'],1:['Speed + Plyo','#4C8DFF'],2:['Upper Body A','#9B6BFF'],3:['Recovery','#2BD47D'],4:['Lower Body B','var(--accent)']};
  let cells='';
  for(let w=0;w<3;w++) days.forEach((d,i)=>{const s=sess[i];const dragTarget=(w==1&&i==0);
    cells+=`<div style="border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px;height:118px;position:relative">
      <div style="font:600 13px Figtree;color:var(--muted)">${w?'':d+' · '}${8+w*7+i}</div>
      ${s&&!dragTarget?`<div style="margin-top:8px;border-radius:10px;background:color-mix(in srgb, ${s[1]} 18%, var(--panel2));border-left:4px solid ${s[1]};padding:9px 10px;font:600 14px Figtree">${s[0]}<div style="font:500 12px Figtree;color:var(--muted);margin-top:3px">${4+i} exercises</div></div>`:''}
      ${dragTarget?`<div style="margin-top:8px;height:62px;border-radius:10px;border:2px dashed var(--accent);background:rgba(255,90,31,.08)"></div>`:''}
    </div>`});
  return `${PH}
  <div class="win" style="position:absolute;left:170px;top:130px;width:1580px;height:780px;display:flex;flex-direction:column">
    <div class="bar"><i></i><i></i><i></i><div style="margin-left:18px;font:600 15px Figtree;color:var(--muted)">Program Builder · Calendar</div></div>
    <div style="display:flex;flex:1">
      <div style="width:300px;border-right:1px solid var(--line);padding:22px">
        <div class="kicker" style="font-size:13px;margin-bottom:14px">Templates</div>
        ${['Off-Season Strength','In-Season Maintenance','Speed Development','Return to Train'].map((t,i)=>`<div style="padding:14px 16px;border-radius:12px;margin-bottom:10px;font:600 16px Figtree;${i==0?'background:rgba(255,90,31,.14);border:1px solid var(--accent)':'background:var(--panel2);border:1px solid var(--line)'}">${t}<div style="font:500 13px Figtree;color:var(--muted);margin-top:4px">${[12,8,6,4][i]} weeks</div></div>`).join('')}
        <div class="kicker" style="font-size:13px;margin:26px 0 14px">Assign to</div>
        <div class="pill" style="background:rgba(255,90,31,.14);border-color:var(--accent)">● Varsity Football · 42</div>
      </div>
      <div style="flex:1;display:flex;flex-direction:column">
        <div style="display:flex;align-items:center;justify-content:space-between;padding:18px 24px;border-bottom:1px solid var(--line)">
          <div style="font:700 26px Figtree">Off-Season Strength <span style="color:var(--muted);font-weight:500">· Weeks 1–3</span></div>
          <div class="pill">Calendar view</div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);flex:1">${cells}</div>
      </div>
    </div>
  </div>
  <div style="position:absolute;left:520px;top:520px;width:200px;transform:rotate(-3deg);border-radius:10px;background:var(--grad);color:#fff;padding:12px 14px;font:700 15px Figtree;box-shadow:0 24px 50px rgba(255,90,31,.25)">Lower Body A<div style="font:500 12px Figtree;color:rgba(255,255,255,.85);margin-top:3px">4 exercises</div></div>
  ${cur(690,560)}
  <div class="cap" style="bottom:52px">Build the program <em>once.</em></div>`;
};

/* ---------- A4 · Athletes log it ---------- */
F.A4 = ()=>`${PH}
  <div style="position:absolute;left:330px;top:150px" class="phone"><div class="screen" style="padding:30px 24px">
    <div style="font:600 14px Figtree;color:var(--muted)">TODAY · LOWER BODY A</div>
    <div style="font:800 30px Figtree;margin:8px 0 22px;letter-spacing:-.02em">Back Squat</div>
    ${[['1','275','5',1],['2','275','5',1],['3','275','—',0]].map(r=>`<div style="display:flex;align-items:center;gap:10px;padding:14px;border-radius:14px;margin-bottom:10px;background:var(--panel2);border:1px solid ${r[3]?'var(--line)':'var(--accent)'}">
      <div style="width:32px;font:700 16px Figtree;color:var(--muted)">S${r[0]}</div>
      <div style="flex:1;font:700 22px Figtree">${r[1]} <span style="font-size:14px;color:var(--muted)">lb</span></div>
      <div style="width:50px;font:700 22px Figtree">${r[2]}</div>
      <div style="width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:${r[3]?'var(--good)':'transparent'};border:2px solid ${r[3]?'var(--good)':'var(--line)'};font:800 16px Figtree;color:#0B0E13">${r[3]?'✓':''}</div></div>`).join('')}
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px">
      ${['1','2','3','4','5','6','7','8','9','·','0','⌫'].map(k=>`<div style="height:52px;border-radius:12px;background:${k==='5'?'var(--grad)':'var(--panel2)'};color:${k==='5'?'#fff':'var(--text)'};display:grid;place-items:center;font:600 22px Figtree;${k==='5'?'transform:scale(.96)':''}">${k}</div>`).join('')}
    </div>
  </div></div>
  ${cur(470,690)}
  <div class="win" style="position:absolute;left:780px;top:190px;width:860px;height:620px;border-radius:30px;border:14px solid #1E212E">
    <div style="padding:26px 30px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)">
      <div style="font:800 28px Figtree">Weight Room · Rack 1–4</div><div class="pill">Lower Body A</div></div>
    ${[['J. Rivera','Back Squat 3×5 @ 285',1],['M. Chen','Back Squat 3×5 @ 255',1],['D. Brooks','Back Squat 3×5 @ 235',1],['K. Owens','Back Squat 3×5 @ 215',0],['T. Patel','Back Squat 3×5 @ 270',0]].map((r,i)=>`<div style="display:flex;align-items:center;padding:20px 30px;border-bottom:1px solid var(--line);opacity:${r[2]?1:.55}">
      <div style="width:46px;height:46px;border-radius:50%;background:var(--panel2);display:grid;place-items:center;font:700 16px Figtree;color:var(--muted)">${r[0].split(' ')[1][0]}</div>
      <div style="margin-left:18px;flex:1"><div style="font:700 20px Figtree">${r[0]}</div><div style="font:500 15px Figtree;color:var(--muted)">${r[1]}</div></div>
      <div style="font:700 15px Figtree;color:${r[2]?'var(--good)':'var(--muted)'}">${r[2]?'✓ Logged':'In progress'}</div></div>`).join('')}
  </div>
  <div class="cap" style="bottom:70px">Athletes log it. <em>In the app or on the rack.</em></div>`;

/* ---------- A5 · See it, adjust it ---------- */
F.A5 = ()=>{
  const bars=[62,70,74,81,88,93,90];
  return `${PH}
  <div class="win" style="position:absolute;left:170px;top:120px;width:1580px;height:660px">
    <div class="bar"><i></i><i></i><i></i><div style="margin-left:18px;font:600 15px Figtree;color:var(--muted)">Coach view · Varsity Football</div></div>
    <div style="display:grid;grid-template-columns:420px 1fr 520px;gap:24px;padding:28px">
      <div style="background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:26px;height:300px">
        <div class="kicker" style="font-size:13px">Today · completed</div>
        <div style="display:flex;align-items:center;gap:26px;margin-top:22px">
          <svg width="150" height="150" viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" stroke="var(--line)" stroke-width="16" fill="none"/><circle cx="75" cy="75" r="62" stroke="var(--good)" stroke-width="16" fill="none" stroke-linecap="round" stroke-dasharray="${2*Math.PI*62*0.905} 999" transform="rotate(-90 75 75)"/></svg>
          <div><div style="font:800 64px Figtree;letter-spacing:-.03em">38<span style="color:var(--muted);font-size:34px">/42</span></div><div style="color:var(--muted);font:500 16px Figtree">athletes logged</div></div>
        </div>
      </div>
      <div style="background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:26px;height:300px">
        <div class="kicker" style="font-size:13px">Back Squat · team avg working weight</div>
        <div style="display:flex;align-items:flex-end;gap:18px;height:190px;margin-top:24px">${bars.map((b,i)=>`<div style="flex:1;height:${b*2}px;border-radius:8px 8px 3px 3px;background:${i==5?'var(--grad)':'#FFE1D3'}"></div>`).join('')}</div>
      </div>
      <div style="background:var(--grad);color:#fff;border-radius:16px;padding:26px;height:300px;box-shadow:0 20px 50px rgba(255,90,31,.3)">
        <div class="kicker" style="font-size:13px;color:rgba(255,255,255,.85)">New PR · J. Rivera</div>
        <div style="font:600 22px Figtree;margin-top:18px">Back Squat</div>
        <div style="font:800 86px Figtree;letter-spacing:-.04em;margin-top:6px">275 <span style="opacity:.65;font-weight:500">→</span> 285</div>
        <div style="display:inline-block;margin-top:4px;padding:4px 12px;border-radius:999px;background:rgba(255,255,255,.22);font:700 18px Figtree">+10 lb</div>
      </div>
    </div>
    <div style="margin:0 28px;background:var(--panel2);border:1px solid var(--line);border-radius:16px;padding:22px 26px">
      <div style="display:flex;justify-content:space-between"><div style="font:700 22px Figtree">Next week · Lower Body A</div><div style="color:var(--muted);font:500 16px Figtree">Week 5</div></div>
      <div style="display:flex;gap:16px;margin-top:18px">
        ${[['Back Squat','4×4'],['RDL','3×6'],['Split Squat','3×8'],['Nordic','3×5']].map((e,i)=>`<div style="flex:1;padding:16px;border-radius:12px;background:var(--panel);border:1px solid ${i==0?'var(--accent)':'var(--line)'}">
          <div style="font:600 17px Figtree">${e[0]}</div><div style="display:flex;justify-content:space-between;margin-top:10px;font:600 16px Figtree;color:var(--muted)">${e[1]}
          <span style="${i==0?'color:var(--text);background:rgba(255,90,31,.2);padding:2px 10px;border-radius:6px':''}">${i==0?'<s style="color:var(--muted);font-weight:500">75%</s> 77.5%':['','70%','—','BW'][i]}</span></div></div>`).join('')}
      </div>
    </div>
  </div>
  ${cur(545,652)}
  <div class="cap" style="bottom:60px">See every rep. <em>Adjust next week.</em></div>`;
};

/* ---------- A6 · Program in sync ---------- */
F.A6 = ()=>{
  const nodes=[['Build',0,-230],['Log',300,0],['See',0,230],['Adjust',-300,0]];
  return `
  <div class="c" style="width:900px;height:640px;margin-top:-60px">
    <svg width="900" height="640" viewBox="-450 -320 900 640" style="position:absolute;inset:0">
      <defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="var(--accent)"/></marker></defs>
      <ellipse cx="0" cy="0" rx="300" ry="230" fill="none" stroke="var(--line)" stroke-width="2"/>
      ${[[-55,-235,'M 110 -205 A 300 230 0 0 1 270 -90'],[0,0,'M 270 90 A 300 230 0 0 1 110 205'],[0,0,'M -110 205 A 300 230 0 0 1 -270 90'],[0,0,'M -270 -90 A 300 230 0 0 1 -110 -205']].map(a=>`<path d="${a[2]}" fill="none" stroke="var(--accent)" stroke-width="5" stroke-linecap="round" marker-end="url(#ah)"/>`).join('')}
    </svg>
    ${nodes.map(n=>`<div style="position:absolute;left:${450+n[1]}px;top:${320+n[2]}px;transform:translate(-50%,-50%);padding:22px 40px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font:800 40px Figtree;letter-spacing:-.02em;box-shadow:var(--shadow);color:#fff;background:var(--grad);border:none">${n[0]}</div>`).join('')}
