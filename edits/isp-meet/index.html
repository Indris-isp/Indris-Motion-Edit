<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meet ISP Agency</title>
<style>
@font-face{font-family:Inter;src:url(../../video/fonts/Inter-400.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(../../video/fonts/Inter-500.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(../../video/fonts/Inter-600.ttf);font-weight:600}
@font-face{font-family:Inter;src:url(../../video/fonts/Inter-700.ttf);font-weight:700}
@font-face{font-family:Inter;src:url(../../video/fonts/Inter-800.ttf);font-weight:800}
@font-face{font-family:'Instrument Serif';src:url(../../video/fonts/InstrumentSerif-Italic.ttf);font-style:italic}

/* ---- BRAND TOKENS ---- */
:root{ --accent:#FF821C; --text:#0A0A0A; }

html,body{margin:0;padding:0;background:#161616;overflow:hidden}
body.render{background:#fff}
#viewport{position:absolute;left:50%;top:0;transform-origin:0 0}
body.render #viewport{left:0}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;
  background:
    radial-gradient(ellipse 70% 45% at 50% 46%, rgba(255,255,255,1) 0%, rgba(255,255,255,0) 100%),
    radial-gradient(ellipse 90% 60% at 50% 110%, rgba(255,130,28,.07) 0%, rgba(255,130,28,0) 70%),
    linear-gradient(180deg,#FFFFFF 0%,#F7F6F4 60%,#EEECE9 100%);
  font-family:Inter,sans-serif;color:var(--text);-webkit-font-smoothing:antialiased}
#dots{position:absolute;inset:-80px;opacity:.5;
  background-image:radial-gradient(circle, rgba(0,0,0,.09) 1.6px, transparent 2px);background-size:54px 54px;
  -webkit-mask-image:radial-gradient(ellipse 60% 50% at 50% 50%, transparent 0%, #000 100%);mask-image:radial-gradient(ellipse 60% 50% at 50% 50%, transparent 0%, #000 100%)}
.blob{position:absolute;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(closest-side,rgba(255,130,28,.16),rgba(255,130,28,.05) 55%,rgba(255,130,28,0))}
.scene{position:absolute;left:0;top:0;width:1080px;height:1920px;visibility:hidden;transform-origin:540px 960px}
#fade{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none}

.abs{position:absolute}
.ctr{position:absolute;transform:translate(-50%,-50%)}
.line{position:absolute;left:0;width:1080px;text-align:center;white-space:pre;line-height:1.12}
.sans{font-family:Inter,sans-serif}
.serif{font-family:'Instrument Serif',serif;font-style:italic;font-weight:400;letter-spacing:-.01em}
.grp,.ch{display:inline-block}

/* gradient type */
.tg-dark{background:linear-gradient(180deg,#5C5C5C 0%,#1E1E1E 50%,#000 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.tg-acc{background:linear-gradient(180deg,#FFC685 0%,#FF8C26 45%,#E44E00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;padding:0 .06em}
.tg-gray{background:linear-gradient(180deg,#8C8C8C 0%,#4E4E4E 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.gl-dark{filter:drop-shadow(0 0 16px rgba(255,140,40,.20)) drop-shadow(0 8px 14px rgba(0,0,0,.14))}
.gl-acc{filter:drop-shadow(0 0 10px rgba(255,130,28,.5)) drop-shadow(0 0 30px rgba(255,130,28,.3))}
.gl-gray{filter:drop-shadow(0 4px 10px rgba(0,0,0,.08))}

.glow{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,130,28,.26),rgba(255,130,28,.09) 55%,rgba(255,130,28,0))}

/* white surfaces */
.card{position:absolute;border-radius:36px;box-sizing:border-box;overflow:hidden;
  background:linear-gradient(160deg,#FFFFFF 0%,#FBFBFB 60%,#F2F2F2 100%);
  box-shadow:0 30px 60px rgba(20,10,0,.10),0 6px 14px rgba(20,10,0,.05),inset 0 1px 0 #fff;border:1px solid rgba(0,0,0,.05);
  display:flex;align-items:center;justify-content:center}
.card img{max-width:76%;max-height:64%;object-fit:contain}
.ph{display:flex;flex-direction:column;align-items:center;gap:16px}
.ph i{display:block;width:74px;height:74px;border-radius:22px;background:linear-gradient(135deg,#E9E7E4,#D6D3CF)}
.ph b{display:block;font:600 26px Inter;letter-spacing:.14em;color:#B9B5B0}
.disc{position:absolute;border-radius:50%;transform:translate(-50%,-50%);
  background:radial-gradient(circle at 35% 28%,#FFFFFF 0%,#FAFAFA 55%,#EFEFEF 100%);
  box-shadow:0 40px 80px rgba(120,50,0,.16),0 0 0 10px rgba(255,130,28,.08),inset 0 2px 0 #fff;
  display:flex;align-items:center;justify-content:center}
.chip{position:absolute;border-radius:50%;
  background:radial-gradient(circle at 35% 28%,#FFFFFF 0%,#F7F7F7 60%,#ECECEC 100%);
  box-shadow:0 20px 40px rgba(20,10,0,.14),0 4px 10px rgba(20,10,0,.06),inset 0 1px 0 #fff;
  display:flex;align-items:center;justify-content:center}
.chip svg{width:50%;height:50%;overflow:visible}
.tile{position:absolute;border-radius:27%;overflow:hidden;
  box-shadow:0 40px 70px rgba(20,10,0,.20),0 8px 18px rgba(20,10,0,.08);
  display:flex;align-items:center;justify-content:center}
.tile::after{content:'';position:absolute;inset:0;border-radius:inherit;
  background:linear-gradient(160deg,rgba(255,255,255,.35) 0%,rgba(255,255,255,0) 40%);box-shadow:inset 0 2px 0 rgba(255,255,255,.5)}
.tile svg{overflow:visible}
.pill{position:absolute;white-space:nowrap;font-size:34px;font-weight:600;padding:16px 34px 16px 30px;border-radius:999px;box-sizing:border-box;letter-spacing:-.01em;
  border:2px solid transparent;transform:translate(-50%,-50%);
  background:linear-gradient(180deg,#FFFFFF,#F3F3F3) padding-box,linear-gradient(135deg,#FFB862,#E65000) border-box;
  box-shadow:0 12px 28px rgba(255,115,20,.16);display:flex;align-items:center;gap:14px}
.pill i{display:block;width:16px;height:16px;border-radius:50%;background:linear-gradient(135deg,#FFB862,#E65000);box-shadow:0 0 12px rgba(255,130,28,.8)}
.player{position:absolute;border-radius:40px;overflow:hidden;
  background:linear-gradient(160deg,#2A2A2A 0%,#111 60%,#050505 100%);
  box-shadow:0 50px 90px rgba(20,10,0,.28),0 10px 20px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.12)}
.bar{position:absolute;height:22px;border-radius:999px;background:linear-gradient(180deg,#EDEBE8,#DCD9D5);box-shadow:inset 0 2px 4px rgba(0,0,0,.08)}
.bar>div{height:100%;border-radius:999px;background:linear-gradient(90deg,#FFB862,#FF821C 60%,#E65000);box-shadow:0 0 18px rgba(255,130,28,.6)}

#ui{position:fixed;left:0;right:0;bottom:0;padding:10px 16px;background:rgba(0,0,0,.6);color:#eee;
  font:13px Inter,sans-serif;display:flex;gap:12px;align-items:center}
#ui input{flex:1}
body.render #ui{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <linearGradient id="gAcc" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFBA66"/><stop offset=".5" stop-color="#FF821C"/><stop offset="1" stop-color="#DD4A00"/></linearGradient>
  <linearGradient id="gDarkV" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5A5A5A"/><stop offset=".5" stop-color="#1A1A1A"/><stop offset="1" stop-color="#000"/></linearGradient>
  <radialGradient id="gIG" cx=".3" cy="1.07" r="1.3"><stop offset="0" stop-color="#FDF497"/><stop offset=".08" stop-color="#FDF497"/><stop offset=".45" stop-color="#FD5949"/><stop offset=".62" stop-color="#D6249F"/><stop offset=".92" stop-color="#285AEB"/></radialGradient>
  <radialGradient id="gCap" cx=".35" cy=".3" r=".8"><stop offset="0" stop-color="#FFD3A0"/><stop offset=".45" stop-color="#FF821C"/><stop offset="1" stop-color="#B83C00"/></radialGradient>
</defs></svg>
<div id="viewport">
  <div id="stage">
    <div id="dots"></div>
    <div id="decor"></div>
    <div id="scenes"></div>
    <div id="fade"></div>
  </div>
</div>
<div id="ui">
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="tc">0.00s</span>
</div>
<audio id="aud" src="out/audio.wav" preload="auto"></audio>
<script src="icons.js"></script>
<script src="brands.js"></script>
<script src="motion.js"></script>
</body>
</html>
