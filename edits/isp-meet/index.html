<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Meet ISP Agency</title>
<style>
@font-face{font-family:Inter;src:url(../../video/fonts/Inter-400.ttf);font-weight:400}
@font-face{font-family:Inter;src:url(../../video/fonts/Inter-500.ttf);font-weight:500}
@font-face{font-family:Inter;src:url(../../video/fonts/Inter-600.ttf);font-weight:600}
@font-face{font-family:Inter;src:url(../../video/fonts/Inter-700.ttf);font-weight:700}
@font-face{font-family:Inter;src:url(../../video/fonts/Inter-800.ttf);font-weight:800}

html,body{margin:0;padding:0;background:#161616;overflow:hidden}
#viewport{position:absolute;left:50%;top:0;transform-origin:0 0}
body.render #viewport{left:0}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:#0B0B0E;font-family:Inter,sans-serif;-webkit-font-smoothing:antialiased}
.layer{position:absolute;inset:0;visibility:hidden;overflow:hidden}
.abs{position:absolute}
.c{position:absolute;transform:translate(-50%,-50%)}
.nowrap{white-space:nowrap}

/* scene backgrounds (sampled from the reference) */
#s1{background:#0B0B0E}
#s2{background:transparent}
#s3{background:radial-gradient(circle at 50% 50%,#121214 0%,#09090B 60%)}
#s4,#s6{background:linear-gradient(115deg,#C6CFF3 0%,#D7DDF6 45%,#E7E9F6 100%)}
#s7{background:linear-gradient(115deg,#E9E9F1 0%,#F2F1F6 50%,#F6F2F5 100%)}

/* app tiles */
.tile{position:absolute;border-radius:24%;display:flex;align-items:center;justify-content:center;overflow:hidden;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.35),inset 0 -3px 8px rgba(0,0,0,.08)}
.tile img{width:62%;display:block}
.green{background:linear-gradient(160deg,#FFB862 0%,#FF8A2A 52%,#EC6410 100%)}
.lime{background:linear-gradient(160deg,#DCEB62 0%,#CEE04A 55%,#BFD43C 100%)}
.pink{background:linear-gradient(160deg,#F7CFF3 0%,#EFB6EA 55%,#E7A5E1 100%)}
.circ{position:absolute;border-radius:50%;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 40% 35%,#FFFFFF 0%,#EEF0F4 70%,#E3E6EC 100%)}
.circ svg{overflow:visible}
.dot{position:absolute;border-radius:50%}
.sq{position:absolute;border-radius:3px}
.word{display:inline-block;white-space:pre}
.pill{display:inline-flex;align-items:center;gap:8px;font:500 26px Inter;color:#474B60;border:2px solid #6A6E86;border-radius:11px;padding:4px 14px 5px;letter-spacing:-.01em}
.card{background:rgba(222,222,231,.85);border-radius:26px;padding:30px 52px 34px 44px}

#ui{position:fixed;left:0;right:0;bottom:0;padding:10px 16px;background:rgba(0,0,0,.6);color:#eee;font:13px Inter,sans-serif;display:flex;gap:12px;align-items:center}
#ui input{flex:1}
body.render #ui{display:none}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <radialGradient id="gIG" cx=".3" cy="1.07" r="1.3"><stop offset="0" stop-color="#FDF497"/><stop offset=".08" stop-color="#FDF497"/><stop offset=".45" stop-color="#FD5949"/><stop offset=".62" stop-color="#D6249F"/><stop offset=".92" stop-color="#285AEB"/></radialGradient>
</defs></svg>
<div id="viewport">
  <div id="stage">
    <div id="cam" style="position:absolute;inset:0;transform-origin:960px 540px">
    <div class="layer" id="s1"></div>
    <div class="layer" id="s2"></div>
    <div class="layer" id="s3"></div>
    <div class="layer" id="s4"></div>
    <div class="layer" id="s5"></div>
    <div class="layer" id="s6"></div>
    <div class="layer" id="s7"></div>
    <div class="abs" id="hero" style="left:0;top:0;width:1920px;height:1080px;pointer-events:none"></div>
    <div class="abs" id="fx" style="left:0;top:0;width:1920px;height:1080px;pointer-events:none"></div>
    </div>
  </div>
</div>
<div id="ui">
  <button id="play">Pause</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="tc">0.00s</span>
</div>
<audio id="aud" src="out/audio.wav" preload="auto"></audio>
<script src="icons.js"></script>
<script src="logo_blocks.js"></script>
<script src="motion.js"></script>
</body>
</html>
