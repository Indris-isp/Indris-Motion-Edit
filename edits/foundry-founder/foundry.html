<!doctype html>
<html><head><meta charset="utf-8">
<title>Foundry founder video renderer</title>
<script src="timeline.js"></script>
<style>
:root{--teal:#20C3B0;--teal2:#13A493;--hl:#5EE6D0;--ink:#0E2233;--ink2:#4A6170;--mist:#EEF7FA;--green:#22B573}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#000}
body{font-family:Inter,"DejaVu Sans",sans-serif;-webkit-font-smoothing:antialiased}
#stage{position:absolute;inset:0;overflow:hidden}
.L{position:absolute;inset:0}
.abs{position:absolute}
#bgL{background:linear-gradient(180deg,#F6FBFD,#E9F4F8)}
.blob{position:absolute;border-radius:50%;filter:blur(60px)}
.sc{position:absolute;inset:0;transform-origin:50% 50%;display:none;will-change:transform,opacity,filter}
.dark{background:linear-gradient(160deg,#0A141D,#10283A)}
.full{position:absolute;left:0;top:0;width:1920px;height:1080px;object-fit:cover}
.glass{background:rgba(255,255,255,.92);border:1px solid rgba(255,255,255,.95);border-radius:28px;box-shadow:0 30px 80px rgba(20,80,100,.18),0 2px 6px rgba(20,80,100,.06)}
.dglass{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);border-radius:28px;box-shadow:0 40px 100px rgba(0,0,0,.40)}
.eyebrow{font:600 18px Inter;letter-spacing:.16em;text-transform:uppercase;color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:10px;border-radius:999px;padding:12px 26px;font:600 26px Inter;white-space:nowrap}
.row{display:flex;justify-content:space-between;align-items:center}
.disp{font-family:"Inter Display",Inter,sans-serif;letter-spacing:-.02em}
/* eric */
#eric{position:absolute;overflow:hidden;z-index:50;display:none;box-shadow:0 40px 90px rgba(10,40,60,.30)}
#eric img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;object-position:50% 22%;filter:contrast(1.05) saturate(.94) brightness(1.02);transform-origin:50% 35%}
#eric .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0) 62%,rgba(8,20,30,.28))}
#tag{position:absolute;left:40px;top:36px;z-index:90;font:600 17px Inter;letter-spacing:.08em;color:#fff;background:rgba(10,26,38,.62);padding:9px 16px;border-radius:999px;text-transform:uppercase}
/* captions */
#cap{position:absolute;left:0;right:0;bottom:62px;z-index:95;display:flex;justify-content:center;pointer-events:none}
#capbox{background:rgba(9,24,35,.80);border-radius:20px;padding:15px 34px 17px;font:500 46px/1.2 Inter;color:#fff;white-space:nowrap;letter-spacing:-.2px;box-shadow:0 12px 40px rgba(0,0,0,.18)}
#capbox span{display:inline-block;margin:0 .13em}
#capbox span.k{font-weight:700}
/* clip */
#clip{position:absolute;z-index:92;width:150px;height:150px;border-radius:44px;background:linear-gradient(160deg,rgba(255,255,255,.96),rgba(225,247,243,.92));border:2px solid rgba(32,195,176,.55);box-shadow:0 18px 40px rgba(16,90,100,.22);display:flex;flex-direction:column;align-items:center;justify-content:center;transform-origin:50% 50%}
#clip svg{width:44%;height:44%}
#clip b{font:700 26px Inter;color:#13897C;margin-top:4px}
#clip i{font:500 12px Inter;font-style:normal;color:#4A6170;letter-spacing:.06em;text-transform:uppercase}
#grain{position:absolute;inset:0;z-index:99;opacity:.055;mix-blend-mode:overlay;pointer-events:none}
.ring{position:absolute;border:4px solid var(--teal);border-radius:16px;box-shadow:0 0 0 10px rgba(32,195,176,.16),0 10px 30px rgba(32,195,176,.25)}
.chip{position:absolute;display:flex;align-items:center;gap:14px;border-radius:20px;padding:16px 24px;font:600 26px Inter;white-space:nowrap}
.tick{width:44px;height:44px;border-radius:50%;background:var(--teal);color:#fff;display:grid;place-items:center;font:700 24px Inter;flex:none}
.node{position:absolute;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;display:grid;place-items:center;font:700 32px Inter;color:#fff;box-shadow:0 16px 40px rgba(20,80,100,.25)}
</style></head>
<body><div id="stage">
  <div id="bgL" class="L"><div class="blob" id="b1" style="width:900px;height:700px;background:#DDF6F2"></div><div class="blob" id="b2" style="width:800px;height:600px;background:#DCEEF8"></div></div>
  <div id="scenes" class="L"></div>
  <div id="eric"><img id="ericImg"><div class="shade"></div></div>
  <div id="over" class="L" style="z-index:70"></div>
  <div id="tag">Stand-in footage · AI twin goes here</div>
  <div id="clip"><svg viewBox="0 0 48 48" fill="none" stroke="#13A493" stroke-width="3.4" stroke-linecap="round"><path d="M31 15v17a7 7 0 0 1-14 0V12a5 5 0 0 1 10 0v19a3 3 0 0 1-6 0V16"/></svg><b>Clip</b><i>mascot PNG</i></div>
  <div id="cap"><div id="capbox"></div></div>
  <canvas id="grain" width="512" height="512"></canvas>
</div>
<script>
// ───────── helpers ─────────
const W=1920,H=1080,TOTAL=149.5,FLYN=1817,ERN=2100;
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const io=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eo=x=>1-Math.pow(1-x,3);
const bo=x=>{const c1=1.5,c3=c1+1;return x<=0?0:x>=1?1:1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const R=(t,a,d)=>cl((t-a)/d);
const lerp=(a,b,k)=>a+(b-a)*k;
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().replace(/[.,?!]/g,'');
const WORDS=TL.words;
function T(w,after=0){w=norm(w);for(const x of WORDS){if(x[1]>=after&&norm(x[0])===w)return x[1]}throw new Error('word '+w+' after '+after)}
function TE(w,after=0){w=norm(w);for(const x of WORDS){if(x[1]>=after&&norm(x[0])===w)return x[2]}throw new Error('word '+w)}
const PEND=[];
function setSrc(img,src){if(img._s!==src){img._s=src;img.src=src;PEND.push(img.decode().catch(()=>{}))}}
const pad=n=>String(n).padStart(5,'0');
function fly(img,s){setSrc(img,'frames/fly/f'+pad(cl(Math.round(s*24)+1,1,FLYN))+'.jpg')}
function ericF(img,s){setSrc(img,'frames/eric/f'+pad(cl(Math.round(s*30)+1,1,ERN))+'.jpg')}
function el(parent,html){const d=document.createElement('div');d.innerHTML=html.trim();const e=d.firstChild;parent.appendChild(e);return e}
function st(e,o){for(const k in o)e.style[k]=o[k]}
function show(e,op,tx=0,ty=0,sc=1,blur=0,extra=''){e.style.opacity=op;e.style.transform=`translate(${tx}px,${ty}px) scale(${sc}) ${extra}`;e.style.filter=blur>0.05?`blur(${blur}px)`:'none';e.style.visibility=op<=0.001?'hidden':'visible'}
// entrance: k in 0..1 → rise + de-blur
function rise(e,k,dy=40,b=10,s0=.96){const kk=eo(k);show(e,cl(k*1.6),0,(1-kk)*dy,lerp(s0,1,kk),(1-kk)*b)}
function pop(e,k,s0=.6){show(e,cl(k*2.2),0,0,lerp(s0,1,bo(k)),(1-cl(k*1.5))*8)}

// ───────── cut points (all from the voiceover) ─────────
const C={
 c1:T('foundry',6)-0.6, c2:T('everything')-0.3, c3:T('switching')-0.25, c4:T('log')-0.2, c5:T('create',30)-0.15,
 c6:T('get',34)-0.2, c7:T('take',44)-0.2, c8:T('it',48.5)-0.2, c9:T('and',55.5)-0.2, c10:T('send',62)-0.2,
 c11:T('meet')-0.25, c12:T("clip's")-0.25, c13:T('we',75.9)-0.3, c14:T('pro',80)-0.25, c15:T('for',92)-0.25,
 c16:T('now',106)-0.25, c17:T('we',109)-0.05, c18:T("here's")-0.25, c19:T('email')-0.25, c20:T('we',132.5)-0.25,
 c21:T('you',136)-0.2, c22:TE('inside',141)+0.45 };

// ───────── scene framework ─────────
const SC=[];
function S(a,b,o,build,upd){const e=el(o.over?$('over'):$('scenes'),`<div class="sc ${o.dark?'dark':''}"></div>`);const s={a,b,o,e,upd};s.ctx=build(e)||{};SC.push(s);return s}
const TR=0.4;

// ───────── Eric (one element, morphs between full frame and card) ─────────
const FULL=[0,0,1920,1080,0], CARD=[120,170,640,740,36], OFFL=[-760,170,640,740,36];
const mix=(A,B,k)=>A.map((v,i)=>lerp(v,B[i],k));
// segments: [a,b,srcOffset,fn(t)->{r:rect,op,blur,sc}]
const ES=[
 {a:0,b:C.c2+0.5,src:1.0,f:t=>{const m=io(R(t,C.c1,0.7)),x=io(R(t,C.c2,0.45));return{r:mix(mix(FULL,CARD,m),OFFL,x),op:1,blur:x*14}}},
 {a:C.c11,b:C.c12+0.5,src:18.0,f:t=>{const i=io(R(t,C.c11,0.45)),x=io(R(t,C.c12,0.45));return{r:mix(mix(OFFL,CARD,i),OFFL,x),op:1,blur:(1-i)*12+x*12}}},
 {a:C.c13,b:C.c14+0.4,src:26.0,f:t=>{const i=eo(R(t,C.c13,0.35)),g=io(R(t,C.c13+0.2,0.6)),x=io(R(t,C.c14,0.4));return{r:mix(mix(OFFL,CARD,i),FULL,g),op:1-x,blur:x*14,sc:1+x*.05}}},
 {a:C.c16,b:C.c17+0.5,src:33.0,f:t=>{const i=io(R(t,C.c16,0.45)),x=io(R(t,C.c17,0.45));return{r:mix(mix(OFFL,CARD,i),OFFL,x),op:1,blur:(1-i)*12+x*12}}},
 {a:C.c18,b:C.c19+0.4,src:40.0,f:t=>{const tin=T('take',117)-0.4,tout=T('you',122.4)-0.45;const i=eo(R(t,C.c18,0.35)),m=io(R(t,tin,0.65)),g=io(R(t,tout,0.6)),x=io(R(t,C.c19,0.4));
   return{r:mix(mix(FULL,CARD,m),FULL,g),op:i*(1-x),blur:(1-i)*12+x*14,sc:lerp(.97,1,i)*(1+x*.05)}}},
 {a:C.c20,b:C.c21+0.4,src:52.0,f:t=>{const i=eo(R(t,C.c20,0.35)),x=io(R(t,C.c21,0.4));return{r:FULL,op:i*(1-x),blur:(1-i)*12+x*14,sc:lerp(.97,1,i)*(1+x*.05)}}},
];
function drawEric(t){
  const E=$('eric'),seg=ES.find(s=>t>=s.a&&t<s.b);
  if(!seg){E.style.display='none';$('tag').style.opacity=0;return 0}
  const v=seg.f(t),[x,y,w,h,r]=v.r;E.style.display='block';
  st(E,{left:x+'px',top:y+'px',width:w+'px',height:h+'px',borderRadius:r+'px',opacity:v.op,filter:v.blur>0.1?`blur(${v.blur}px)`:'none',transform:`scale(${v.sc||1})`});
  const im=$('ericImg');ericF(im,seg.src+(t-seg.a));im.style.transform=`scale(${1.0+0.05*R(t,seg.a,seg.b-seg.a)})`;
  $('tag').style.opacity=v.op>0.5&&w>500?0.95:0;
  return w>1500?1:0.5;
}

// ───────── Clip ─────────
let CLIP_ON=[];  // [a,b] ranges where Clip sits in the corner
function drawClip(t){
  const c=$('clip');let on=0;for(const[a,b]of CLIP_ON)on=Math.max(on,R(t,a+0.15,0.35)*(1-R(t,b-0.1,0.3)));
  // hero moment: Meet Clip
  const tm=T('clip',67)-0.25,hk=bo(R(t,tm,0.6))*(1-io(R(t,C.c12+0.3,0.6)));
  const heroVis=t>=tm-0.01&&t<C.c12+0.95?1:0;
  const vis=Math.max(on,heroVis);
  const bob=Math.sin(t*2.3)*3;
  const x=lerp(1920-56-150,1260,hk),y=lerp(1080-44-150+bob,280,hk),s=lerp(1,2.5,hk);
  st(c,{left:x+'px',top:y+'px',opacity:vis,transform:`scale(${s}) rotate(${Math.sin(t*1.7)*1.5*(1-hk)}deg)`,display:vis>0.001?'flex':'none'});
}

// ───────── captions ─────────
const CH=TL.chunks;let capIdx=-2;
function drawCap(t){
  const box=$('capbox');let i=-1;
  for(let j=0;j<CH.length;j++){const c=CH[j],n=CH[j+1];const end=Math.min(n?n.s-0.1:1e9,c.e+0.6);if(t>=c.s-0.12&&t<end){i=j;break}}
  if(t>=C.c22-0.2)i=-1;
  if(i<0){box.style.opacity=0;capIdx=-1;return}
  const c=CH[i];
  if(i!==capIdx){box.innerHTML=c.w.map((w,j)=>`<span class="${j===c.k?'k':''}">${w[0]}</span>`).join(' ');capIdx=i}
  const n=CH[i+1],end=Math.min(n?n.s-0.1:1e9,c.e+0.6),gapNext=!n||n.s-c.e>0.5;
  const ki=eo(R(t,c.s-0.12,0.14)),ko=gapNext?R(t,end-0.18,0.18):0;
  box.style.opacity=ki*(1-ko);box.style.transform=`translateY(${(1-ki)*8}px)`;
  [...box.children].forEach((sp,j)=>{const k=R(t,c.w[j][1]-0.07,0.2),kk=eo(k);
    const key=j===c.k;sp.style.opacity=0.36+0.64*kk;sp.style.transform=`translateY(${(1-kk)*6}px) scale(${key?lerp(.88,1,bo(k)):1})`;sp.style.color=key?(k>0.2?'#5EE6D0':'#fff'):'#fff';sp.style.filter='none'});
}

// ───────── backgrounds ─────────
function drawBg(t){st($('b1'),{left:(980+Math.sin(t*.13)*220)+'px',top:(-180+Math.cos(t*.11)*120)+'px'});st($('b2'),{left:(-120+Math.cos(t*.09)*200)+'px',top:(560+Math.sin(t*.12)*120)+'px'})}
function darkBg(e){el(e,`<div class="blob" style="width:1100px;height:800px;left:900px;top:380px;background:#2F8EA3;opacity:.55"></div>`);el(e,`<div class="blob" style="width:700px;height:600px;left:-100px;top:-200px;background:#173A55;opacity:.8"></div>`)}

// ═════════ SCENES ═════════
// S2: flyover "Every job / note / photo" beside Eric's card
S(C.c1+0.15,C.c2,{},e=>{const im=el(e,`<img class="abs" style="left:780px;top:120px;width:1140px;height:641px;object-fit:cover;-webkit-mask-image:radial-gradient(ellipse 62% 62% at 52% 50%,#000 55%,transparent 100%)">`);return{im}},
 (c,lt,t)=>{fly(c.im,0.0+lt*0.95)});

// S3: mirror translation
S(C.c2,C.c3,{clip:1},e=>{
 const card=(x,lab,title,sub,rows,btn)=>el(e,`<div class="glass abs" style="left:${x}px;top:220px;width:600px;padding:44px 48px;transform-origin:50% 100%">
   <div class="eyebrow">${lab}</div><div class="disp" style="font:700 52px Inter;color:#0E2233;margin:16px 0 6px">${title}</div>
   <div style="font:500 24px Inter;color:#4A6170">${sub}</div>
   <div style="margin-top:32px;display:grid;gap:16px;font:500 27px Inter;color:#0E2233">${rows.map((r,i)=>`<div class="row" style="${i==rows.length-1?'border-top:1px solid #DCE8EE;padding-top:16px;font-weight:700':''}"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')}</div>
   <div class="pill" style="margin-top:30px;background:#E3F8F4;color:#13897C;font-size:24px">${btn}</div></div>`);
 const EN=[['Cabinet build','$8,400'],['Install & finish','$2,150'],['Total','$10,550']];
 const ES=[['Fabricación de gabinetes','$8,400'],['Instalación y acabado','$2,150'],['Total','$10,550']];
 const L=card(250,'You see · English','Estimate','Custom mahogany kitchen cabinets',EN,'Send to client →');
 const Ren=card(1070,'Your customer sees','Estimate','Custom mahogany kitchen cabinets',EN,'Approve →');
 const Res=card(1070,'Tu cliente ve · Español','Presupuesto','Gabinetes de cocina de caoba',ES,'Aprobar →');
 const line=el(e,`<div class="abs" style="left:959px;top:190px;width:2px;height:640px;background:linear-gradient(180deg,transparent,#20C3B0,transparent);transform-origin:50% 50%"></div>`);
 const disc=el(e,`<div class="abs" style="left:922px;top:472px;width:76px;height:76px;border-radius:50%;background:#fff;display:grid;place-items:center;font:700 34px Inter;color:#20C3B0;box-shadow:0 10px 30px rgba(32,195,176,.35)">⇄</div>`);
 const tog=el(e,`<div class="abs" style="left:810px;top:96px;width:300px;height:64px;border-radius:999px;background:#fff;box-shadow:0 10px 30px rgba(20,80,100,.12)"><div id="knob" style="position:absolute;left:6px;top:6px;width:144px;height:52px;border-radius:999px;background:#20C3B0"></div><div class="row" style="position:absolute;inset:0;padding:0 30px;font:600 24px Inter"><span id="t1" style="color:#fff">English</span><span id="t2" style="color:#4A6170">Español</span></div></div>`);
 const stamp=el(e,`<div class="abs disp glass" style="left:720px;top:400px;width:480px;padding:26px 0;text-align:center;font:800 140px/1 Inter;color:#0E2233;letter-spacing:-5px;border-radius:40px"><span id="pct">0</span><span style="color:#20C3B0">%</span></div>`);
 const sweep=el(e,`<div class="abs" style="top:180px;height:700px;width:260px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.85),transparent);transform:skewX(-18deg)"></div>`);
 return{L,Ren,Res,line,disc,tog,stamp,sweep}},
 (c,lt,t)=>{const a=C.c2;
  const kL=R(t,a+0.05,0.6),kR=R(t,a+0.17,0.6);
  const spr=io(R(t,T('100%')-0.5,0.5))*90;show(c.L,cl(kL*1.6),-spr,(1-eo(kL))*90,1,(1-eo(kL))*10,`perspective(1400px) rotateX(${(1-eo(kL))*16}deg)`);
  const tf=T('translated'),f=R(t,tf-0.05,0.5),ang=f<.5?f*2*90:(1-(f-.5)*2)*-90+0; // 0→90 then -90→0
  const showES=f>=.5;const cardR=showES?c.Res:c.Ren;(showES?c.Ren:c.Res).style.visibility='hidden';
  show(cardR,cl(kR*1.6),spr,(1-eo(kR))*90,1,(1-eo(kR))*10,`perspective(1400px) rotateX(${(1-eo(kR))*16}deg) rotateY(${f<.5?io(f*2)*90:-90+io((f-.5)*2)*90}deg)`);
  const hl=(e,k)=>{e.style.boxShadow=`0 30px 80px rgba(20,80,100,.18),0 0 0 ${k*5}px rgba(32,195,176,${k*.55})`};
  hl(c.L,R(t,T('only',11)-0.1,0.3)*(1-R(t,T('and',13)-0.05,0.3)));hl(cardR,R(t,T('customer')-0.2,0.3)*(1-R(t,T('english')+0.3,0.3)));
  show(c.line,cl(R(t,a+0.25,0.4)*1.5),0,0,1,0,`scaleY(${eo(R(t,a+0.25,0.6))})`);pop(c.disc,R(t,a+0.4,0.5));
  rise(c.tog,R(t,a+0.15,0.5),-30);
  const sp=R(t,T('spanish')-0.15,0.35)*(1-R(t,T('100%')+0.2,0.35));
  c.tog.querySelector('#knob').style.left=lerp(6,150,io(sp))+'px';c.tog.querySelector('#t1').style.color=sp>.5?'#4A6170':'#fff';c.tog.querySelector('#t2').style.color=sp>.5?'#fff':'#4A6170';
  const sw=R(t,T('mirror')-0.1,0.7);c.sweep.style.left=lerp(150,1700,io(sw))+'px';c.sweep.style.opacity=sw>0&&sw<1?1:0;
  const tp=T('100%');const kp=R(t,tp-0.35,0.5);pop(c.stamp,kp,.5);c.stamp.querySelector('#pct').textContent=Math.round(100*eo(R(t,tp-0.35,0.45)));
 });

// S4: switching / import
S(C.c3,C.c4,{clip:1},e=>{
 const zone=el(e,`<div class="glass abs" style="left:510px;top:170px;width:900px;height:580px;border:3px dashed rgba(32,195,176,.55);display:flex;flex-direction:column;align-items:center;padding-top:60px">
   <svg width="96" height="96" viewBox="0 0 48 48" fill="none" stroke="#20C3B0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 32h-4a8 8 0 0 1-1-15.9A11 11 0 0 1 32.5 14 7 7 0 0 1 36 32h-4"/><path d="M24 22v16M18 28l6-6 6 6"/></svg>
   <div class="disp" style="font:700 44px Inter;color:#0E2233;margin-top:14px">Import your client list</div>
   <div style="font:500 26px Inter;color:#4A6170;margin-top:8px">Photo, PDF or spreadsheet</div>
   <div style="position:absolute;left:80px;right:80px;bottom:40px;height:14px;border-radius:7px;background:#E3EEF2;overflow:hidden"><div id="bar" style="height:100%;width:0;background:linear-gradient(90deg,#20C3B0,#22B5D6)"></div></div>
   <div id="cnt" style="position:absolute;right:80px;bottom:64px;font:600 24px Inter;color:#13897C"></div></div>`);
