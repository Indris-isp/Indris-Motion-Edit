function rr(g,x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath()}

async function frame(t){const n=Math.min(316,Math.max(1,Math.round(t*FPS)+1));const s=`${FRAMES}/f${String(n).padStart(5,'0')}.jpg`;
  if(vi.dataset.s!==s){vi.src=s;vi.dataset.s=s;await vi.decode()}return n-1}
function aroll(t,fi){
  const tr=TRACK[Math.min(fi,TRACK.length-1)]||{cx:.5,cy:.41};
  const fx=tr.cx*W,fy=tr.cy*H;
  // framing states: punch-in (fh≈.21, face at y .33) → wide (fh≈.17, y .41) → split bottom (face at y .65 of the full frame)
  const z=eio(k(t,...T.zoomOut)), d=eio5(k(t,...T.drag));
  const sIn=1.32,sWide=1.10,sSplit=1.06;
  let s=lerp(lerp(sIn,sWide,z),sSplit,d);
  const slide=d*960;                          // the video's top edge rides the top panel's bottom edge
  let ty=lerp(lerp(.33,.41,z)*H,.65*H-960,d); // where the face sits inside the video layer (ends at .65 of the frame)
  const tx=W/2;
  let ox=tx-fx*s, oy=ty-fy*s;
  ox=Math.min(0,Math.max(W-W*s,ox)); oy=Math.min(0,Math.max((H-slide)-H*s,oy)); // never show an edge
  vi.style.transform=`translate(${ox}px,${oy}px) scale(${s})`;
  // the drag: the whole video layer slides down so the face lands at .65 of the frame (R8: 10 frames, ease in-out)
  vid.style.transform=`translateY(${slide}px)`;
  vid.style.filter=`blur(${Math.sin(Math.PI*d)*2.2}px)`;
}

function place(e,cx,cy,s=1,extra=''){const w=e.firstChild.offsetWidth,h=e.firstChild.offsetHeight;css(e,{transform:`translate(${cx-w/2}px,${cy-h/2}px) scale(${s}) ${extra}`})}

const T2={dragIn:[0.50,.80],grow:[1.80,.60],back:[5.80,.55]};
// v10.2: "By the time your sales representative calls the next day" plays on Kirti; the timer runs above her head
const GLD='background:rgba(22,20,28,.78);backdrop-filter:blur(24px);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.12),0 24px 60px -18px rgba(0,0,0,.55)';
const tOv=el('div','abs');css(tOv,{left:0,top:0,width:W+'px',display:'none',textAlign:'center'});
tOv.innerHTML=`<div style="display:inline-block;padding:26px 56px 30px;border-radius:44px;${GLD}"><div class="lab" style="font:500 24px GeistMono;letter-spacing:.3em;color:#AEAEB2">NO REPLY FOR</div>
  <div class="tm" style="font:200 168px Geist;letter-spacing:-.06em;line-height:1;margin-top:10px;color:#fff;font-variant-numeric:tabular-nums"></div></div>`;
const cOv=el('div','abs');css(cOv,{left:0,top:0,width:W+'px',display:'none',textAlign:'center'});
cOv.innerHTML=`<div style="display:inline-flex;align-items:center;gap:20px;padding:20px 26px;border-radius:999px;${GLD}">
  <div style="width:72px;height:72px;border-radius:50%;background:#3A3842;color:#fff;display:flex;align-items:center;justify-content:center;font:600 26px Geist">SS</div>
  <div style="text-align:left"><div style="font:600 32px Geist;letter-spacing:-.03em;color:#fff">Calling Rahul Mehta…</div><div style="font:400 22px Geist;color:#AEAEB2;margin-top:2px">Skyline Sales · 10:30 AM</div></div>
  <div style="width:64px;height:64px;border-radius:50%;background:#34C759;display:flex;align-items:center;justify-content:center;margin-left:10px"><svg width="30" height="30" viewBox="0 0 24 24"><path fill="#fff" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.3.2 2.5.6 3.6.1.3 0 .7-.2 1z"/></svg></div></div>`;
window.renderAt=async function(t){
  const fi=await frame(t);
  const din=sk(t,...T2.dragIn),grow=sk(t,...T2.grow),dout=sk(t,...T2.back);
  const PH=960+960*grow*(1-0)*(dout<1?1:1);           // the panel grows to full screen, smoothly
  const FULL=grow>=1;
  {const tr=TRACK[Math.min(fi,TRACK.length-1)]||{cx:.5,cy:.41};const fx=tr.cx*W,fy=tr.cy*H;const z=SM(k(t,0.04,.5));
   let s,ty,slide;
   if(t<T2.back[0]){s=lerp(lerp(1.32,1.10,z),1.06,din);slide=din*960+grow*960;ty=lerp(lerp(.33,.41,z)*H,.65*H-960,din)}
   else{const pin=SM(k(t,9.5,1.06));s=lerp(1.06,1.30,pin);slide=0;ty=lerp(.47,.36,pin)*H}
   let ox=W/2-fx*s,oy=ty-fy*s;ox=Math.min(0,Math.max(W-W*s,ox));oy=Math.min(0,Math.max((H-Math.min(slide,960))-H*s,oy));
   vi.style.transform=`translate(${ox}px,${oy}px) scale(${s})`;css(vid,{transform:`translateY(${slide}px)`,display:(FULL&&dout<=0)?'none':'block'})}
  const panelY=t<T2.back[0]?(din-1)*960:-dout*1920;
  css(topP,{transform:`translateY(${panelY}px)`,display:(din>0&&dout<1)?'block':'none',height:PH+'px'});
  css(seam,{top:(din*960+grow*960)+'px',display:(din>0&&!FULL)?'block':'none'});
  css(pill,{top:lerp(40,150,grow)+'px'});css(kar,{top:lerp(850,1660,grow)+'px'});
  BLOBS.forEach(o=>css(o.b,{left:(o.x*W+Math.sin(t*.45+o.i)*70)+'px',top:(o.y*PH+Math.cos(t*.35+o.i*2)*60)+'px'}));
  const STK=null;
  if(STK&&(t<T2.dragIn[0]+.2||t>=9.5)){const out=t<3?k(t,T2.dragIn[0]-.04,.2):0,top=t<3?lerp(90,170,SM(k(t,0.04,.5))):150;
    stack.innerHTML=STK.map(([w,st,f,dx])=>{const p=SM(k(t,st,.3));return `<div style="font:${f} Geist;letter-spacing:-.045em;color:${t>=9.5?'#1D1D1F':'#1D1D1F'};transform:translate(${dx}px,${(1-p)*26}px);opacity:${p*(1-out)};filter:blur(${(1-p)*8}px)"><span>${w}</span></div>`}).join('');
    css(stack,{display:'block',top:top+'px'})}else stack.style.display='none';
  // reference-reel captions: hard swap on the word, 1–3 words, lowercase
  {let c=null;for(const x of CH)if(t+1e-6>=x[1])c=x;
   if(c){capEl.textContent=c[0];const aroll=din<=0||dout>=.35;const split=!aroll&&grow<1;
     if(aroll){css(capEl,{display:'block',color:'#fff',fontWeight:'800',fontSize:'64px',background:'rgba(30,28,36,.72)',padding:'16px 30px 18px',borderRadius:'18px',textShadow:'none',backdropFilter:'blur(10px)'});
       const w=capEl.offsetWidth;css(capEl,{transform:`translate(${540-w/2}px,1180px)`})}
     else{css(capEl,{display:'block',color:'#fff',fontWeight:'600',fontSize:'54px',background:'rgba(30,28,36,.72)',padding:'14px 26px 16px',borderRadius:'16px',textShadow:'none',backdropFilter:'blur(10px)'});
       const w=capEl.offsetWidth,h=capEl.offsetHeight,y=split?(din*960+grow*960)-h/2:1500;css(capEl,{transform:`translate(${540-w/2}px,${y}px)`})}}
   else capEl.style.display='none'}
  // timer + call above Kirti's head (A-roll part)
  {const on=sk(t,T2.back[0]+.25,.45)*(1-sk(t,9.42,.4));
   if(on>0){const mins=Math.round(110*SM(k(t,6.05,.6))+(t>6.65?SM(k(t,6.65,2.3))*(638-110):0));
     tOv.querySelector('.tm').textContent=`${Math.floor(mins/60)}h ${String(mins%60).padStart(2,'0')}m`;tOv.querySelector('.lab').textContent=t<8.78?'NO REPLY FOR':'NEXT DAY · 10:30 AM';
     css(tOv,{display:'block',opacity:on,transform:`translateY(${120+(1-on)*-20}px)`,filter:`blur(${(1-on)*8}px)`});
     const pc=sk(t,8.36,.5)*(1-sk(t,9.42,.4));css(cOv,{display:pc>0?'block':'none',opacity:pc,transform:`translateY(${lerp(1340,1310,pc)}px) scale(${lerp(.95,1,pc)})`})}
   else{tOv.style.display='none';cOv.style.display='none'}}
  if(din<=0||dout>=1)return;
  [bar,pdf,cursor,sendAll,dev,shadowEl,waitC,callC].forEach(e=>show(e,false));leads.forEach(c=>show(c,false));
  // ---------- 1) search bar opens (glow) and types; 2) four clients pop up; 3) drag the brochure across all four; 4) send to all
  const sendDone=sk(t,3.02,.3);
  if(t<TP.in+.3){
    const pb=sk(t,0.86,.62),barY=lerp(lerp(560,500,pb),300,grow);show(bar,pb>0);
    const msg='Send the brochure to new clients';const n=Math.floor(msg.length*k(t,1.16,.62));Q('.typed').textContent=msg.slice(0,n);Q('.ph').style.display=n>0?'none':'inline';
    Q('.caret').style.opacity=(Math.floor(t*4)%2===0||(t>1.1&&t<1.8))?1:0;
    const ang=t*140;Q('.glow').style.background=`conic-gradient(from ${ang}deg,#9A6BF0,#F08BE0,#C07BFF,#8B5CF6,#9A6BF0)`;Q('.glow').style.opacity=pb*(.6+.2*Math.sin(t*3));
    Q('.ring').style.background=`conic-gradient(from ${ang}deg,#9A6BF0,#F08BE0,#C07BFF,#8B5CF6,#9A6BF0)`;Q('.ring').style.opacity=pb;
    const fade=1-sendDone;place(bar,540,barY,lerp(.94,1,pb));bar.style.opacity=pb*fade;bar.style.filter=`blur(${(1-pb)*8}px)`;
    // the four clients pop up under the bar (full screen)
    const tops=[600,800,1000,1200];
    const cy=lerp(560,1250,sk(t,2.36,.56));                   // drag path down the list
    leads.forEach((c,i)=>{const p=sk(t,1.98+i*.08,.42);if(p<=0)return;show(c,true);const near=(t>2.3&&t<2.98)?Math.max(0,1-Math.abs(cy-tops[i])/140):0;
      const got=sk(t,2.44+i*.13,.2),sent=sk(t,3.06+i*.03,.2);
      place(c,540,tops[i]+(1-p)*50-near*8,lerp(.94,1,p)*(1+near*.025));c.style.opacity=p*(1-sk(t,TP.in-.05,.2));c.style.filter=`blur(${(1-p)*8}px)`;
      Q('.hl',c).style.opacity=near;Q('.got',c).style.opacity=got;Q('.st',c).textContent=sent>.5?'Sent ✓':'Added'});
    // the brochure: floats in, the cursor grabs it and drags it across all four
    const pIn=sk(t,1.90,.36);
    if(pIn>0&&t<3.0){show(pdf,true);const dragging=t>=2.30;const px=dragging?760:lerp(760,760,pIn),py=dragging?cy:lerp(470,440,pIn);
      place(pdf,px,py,dragging?.55:lerp(.94,1,pIn)*.9);pdf.style.opacity=pIn*(1-k(t,2.92,.08))}
    if(t>2.08&&t<3.25){show(cursor,true);let x,y;
      if(t<2.30){const u=sk(t,2.08,.22);x=lerp(1000,800,u);y=lerp(900,460,u)}
      else if(t<2.94){x=800;y=cy+20}
      else{const u=sk(t,2.94,.12);x=lerp(800,560,u);y=lerp(cy+20,1420,u)}
      const grab=(t>2.26&&t<2.94)?.9:1,click=1-.14*Math.sin(Math.PI*k(t,3.02,.12));
      css(cursor,{transform:`translate(${x}px,${y}px) scale(${grab*click})`,transformOrigin:'0 0',opacity:1-k(t,3.15,.1)})}
    const ps=sk(t,2.86,.3);if(ps>0&&t<TP.in+.1){show(sendAll,true);const press=1-.06*Math.sin(Math.PI*k(t,3.02,.14));place(sendAll,540,1440,lerp(.9,1,ps)*press);sendAll.style.opacity=ps*(1-sk(t,TP.in-.05,.2))}
  }
  // ---------- 5) the phone rises while rotating (3D) and settles; the sales-side chat
  const ph=sk(t,TP.in,.95),away=0;
  if(ph>0&&away<1){show(dev,true);show(shadowEl,true);g.setTransform(SS,0,0,SS,0,0);phoneScreen(t);g.setTransform(1,0,0,1,0,0);
    const DS=1.28*lerp(1,.92,away),cx=540,cy=lerp(1920+DEVH*1.28/2+60,960,ph)-away*80;
    const vel=Math.abs(SM(k(t+1/30,TP.in,.95))-SM(k(t-1/30,TP.in,.95)))*15;
    const ry=lerp(-160,-10,ph)+sk(t,TP.in+.85,2.0)*6,rx=lerp(30,4,ph),rz=lerp(-14,0,ph);
    {const front=Math.cos(ry*Math.PI/180)*Math.cos(rx*Math.PI/180)>=0;dev.querySelector('.face.front').style.display=front?'block':'none';dev.querySelector('.face.back').style.display=front?'none':'block'}
    css(dev,{transform:`translate(${cx-DEVW*DS/2}px,${cy-DEVH*DS/2}px) scale(${DS}) perspective(1700px) rotateY(${ry}deg) rotateX(${rx}deg) rotateZ(${rz}deg)`,transformOrigin:'50% 50%',opacity:'',filter:vel>.04?`blur(${Math.min(14,vel*9)}px)`:'none'});
    css(shadowEl,{left:(cx-DEVW*DS*.4)+'px',width:(DEVW*DS*.8)+'px',top:(cy+DEVH*DS/2-10)+'px',height:'70px',opacity:ph*(1-away)*.7,background:'radial-gradient(closest-side,rgba(0,0,0,.7),rgba(0,0,0,0))'})}
  // ---------- 6) the time keeps going → next day
  const pw=0;if(pw>0){show(waitC,true);const mins=Math.round(110*SM(k(t,5.9,.7))+(t>6.54?SM(k(t,6.54,2.4))*(638-110):0));
    Q('.tm',waitC).textContent=`${Math.floor(mins/60)}h ${String(mins%60).padStart(2,'0')}m`;Q('.lab',waitC).textContent=t<8.78?'NO REPLY FOR':'NEXT DAY · 10:30 AM';
    place(waitC,540,lerp(880,840,pw),1+sk(t,5.9,3)*.04);waitC.style.opacity=pw;waitC.style.filter=`blur(${(1-pw)*10}px)`}
  const pc=0;if(pc>0){show(callC,true);place(callC,540,lerp(1340,1230,pc),lerp(.96,1,pc));callC.style.opacity=pc}
  // labels + caption line
  const pc2=cur(PILLS,t);
  if(pc2&&t<T2.back[0]){const pp=SM(k(t,pc2[0],.4));pill.innerHTML=DOT+`<span>${pc2[1]}</span>`;css(pill,{display:'flex',opacity:pp,transform:`translateX(-50%) translateY(${(1-pp)*-16}px)`})}else pill.style.display='none';
  let line=null;for(const L of LINES)if(t+1e-6>=L[0][1])line=L;
  if(false){kar.innerHTML=line.filter(([w,st])=>t+1e-6>=st).map(([w,st,key])=>{const p=SM(k(t,st,.28));return `<span class="${key?'key':''}" style="opacity:${p};transform:translateY(${(1-p)*14}px);filter:blur(${(1-p)*6}px)">${w}</span>`}).join('');kar.style.display='block'}else kar.style.display='none';
};
document.fonts.load('600 40px Geist').then(()=>document.fonts.load('400 20px GeistMono')).then(()=>new Promise(r=>{if(COVER.complete)r();else{COVER.onload=r;COVER.onerror=r}})).then(()=>{window.READY=true});
</script></body></html>
